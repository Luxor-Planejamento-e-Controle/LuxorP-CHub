<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luxor · Planejamento &amp; Controle</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img class="mark" src="assets/luxor-logo.png" alt="Luxor" height="30">
      <div class="txt"><span>P&amp;C HUB</span></div>
      <button class="nav-close" id="navCloseBtn" aria-label="Fechar menu" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      © Luxor · Planejamento &amp; Controle
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="collapse-btn" id="collapseBtn" title="Recolher menu" aria-label="Recolher menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div>
        <h1 id="pageTitle">Início</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="spacer"></div>
      <span class="chip" id="userChip" hidden><span id="userName"></span> <span class="avatar" id="userAvatar"></span></span>
      <button class="chip chip-btn" id="signOut" type="button" hidden>Sair</button>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<script src="assets/vendor/echarts.min.js"></script>
<script src="assets/vendor/supabase.min.js"></script>
<script src="assets/config.js"></script>
<!-- dados locais da demo offline; em produção vêm do bucket privado (assets/auth.js) -->
<script src="assets/data/indicadores.js" onerror="void 0"></script>
<script src="assets/data/dre.js" onerror="void 0"></script>
<script src="assets/app.js"></script>
<script src="assets/auth.js"></script>
</body>
</html>
