[build]
  publish = "."
  command = ""
  # O plano cobra 15 créditos por DEPLOY DE PRODUÇÃO, não por minuto de build —
  # 300 créditos/mês = 20 deploys. No 1º ciclo, 17 dos 28 deploys só mexeram em
  # script/doc/SQL e republicaram um site idêntico: 255 créditos à toa.
  # `git diff --quiet` sai 0 quando NÃO há diferença, e o Netlify cancela o
  # build nesse caso. Sem CACHED_COMMIT_REF (1º build) o comando falha e o
  # build acontece — que é o lado seguro de errar.
  #
  # Esse filtro não resolve tudo: 1 deploy nesse site em 20/08/2026 (aba Controle
  # de Vendas HPG) foi mudança real, sem nada a filtrar. Somado ao HubHPG, o ciclo
  # gastou 105 dos 300 créditos em só 7 dias. Por isso a Netlify não observa mais
  # `main` — observa `live`. O workflow `publica.yml` avança `live` até `main` 1x/dia
  # (ou sob demanda, via "Run workflow"), então todos os pushes do dia em `main`
  # viram UM deploy só. Push em `main` continua livre e frequente.
  #
  # BUG achado em 31/08/2026, site preso na versão de 20/08 (11 dias sem publicar
  # nada, TODO deploy cancelado calado): aquele deploy de 20/08 foi um `netlify
  # deploy --prod` MANUAL via CLI (contornando o teto de crédito estourado então),
  # sem commit_ref nenhum. Todo build git seguinte comparou contra
  # $CACHED_COMMIT_REF VAZIO — e "sem CACHED_COMMIT_REF o comando falha" (comentário
  # de cima) estava ERRADO: bash com variável vazia simplesmente OMITE o argumento,
  # então virava `git diff --quiet $COMMIT_REF -- ...`, um diff de UM ref só contra
  # a própria árvore que o build acabou de dar checkout — vazio por definição, sempre
  # "sem mudança". Guarda explícita agora: sem CACHED_COMMIT_REF, força build.
  ignore = "[ -z \"$CACHED_COMMIT_REF\" ] && exit 1; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)tools' ':(exclude)docs' ':(exclude)sql' ':(exclude)*.md' ':(exclude).githooks' ':(exclude).gitignore' ':(exclude).gitattributes'"

# Site interno: não indexar e não vazar referrer pra fora.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# A aba Projetos roda em iframe do próprio hub — nunca de outro site.
[[headers]]
  for = "/assets/projetos/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self'"
