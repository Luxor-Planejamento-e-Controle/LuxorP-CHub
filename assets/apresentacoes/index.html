<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apresentações · Luxor P&amp;C</title>
<!-- Comitê de Resultados FO e Board, que saíram do Power BI. A mesma página serve as
     duas abas do hub (?deck=comite_fo | board_fo); o desenho é do ap_layout.js e o
     dado, do tools/build_apresentacoes.py (ver o cabeçalho de cada um). -->
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../theme.css">
<style>
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);overflow:hidden}
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);
  background:var(--bg-2)}
.barra h1{font-size:15px;margin:0 8px 0 0;font-weight:600;white-space:nowrap}
.barra select,.barra button{font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.barra select:hover,.barra button:hover:not(:disabled){border-color:var(--line-strong)}
.barra button:disabled{opacity:.45;cursor:default}
.barra #ir{max-width:340px}
.barra .esp{flex:1}
.barra #pos{font-size:12px;color:var(--ink-2);min-width:52px;text-align:center}
#aviso{font-size:11.5px;color:var(--ink-3)}
#reproc-status{font-size:11.5px;color:var(--ink-2);padding:0 18px}
#reproc-status:empty{display:none}
#reproc-status.erro{color:var(--neg)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
.slide{position:absolute;left:50%;top:50%;transform-origin:center center;
  overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.slide .pr,.slide .pt,.slide .pi{position:absolute;box-sizing:border-box}
.slide .pt{display:flex;white-space:pre;line-height:1.15}
.slide .pt.quebra{white-space:normal}
.slide .pt span{display:block}
.slide .pt.quebra span{display:inline}
.slide .pi.cobre{object-fit:cover}
.slide .pi.cabe{object-fit:contain}
.slide .ppar{position:absolute;box-sizing:border-box;overflow:hidden}
.slide .plinhas{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.slide .moeda{position:absolute;width:60px;height:30px;background:transparent;border:0;cursor:pointer}
.vazio{max-width:560px;margin:80px auto;padding:24px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.vazio h2{margin:0 0 8px;font-size:17px}
.vazio p{margin:0;color:var(--ink-2);font-size:13px}
body.play .barra,body.play #reproc-status{display:none}
body.play #stage{background:#000;cursor:pointer}
body.play .slide{box-shadow:none}
#impressao{display:none}
@media print{
  /* o tamanho da folha (@page) vem de #pagina-impressa: muda entre slide e carta */
  body.imprimindo{display:block;overflow:visible;background:#fff}
  body.imprimindo .barra,body.imprimindo #stage,body.imprimindo #reproc-status{display:none}
  body.imprimindo #impressao{display:block}
  #impressao .slide{position:relative;left:0;top:0;transform:none;box-shadow:none;break-after:page;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:760px){.barra h1{display:none}.barra #ir{max-width:150px}}
/* editor dos textos da carta: painel na metade de baixo, a prévia continua em cima */
#editor{position:fixed;left:0;right:0;bottom:0;height:58vh;z-index:20;background:var(--bg-2);
  border-top:1px solid var(--line-strong);box-shadow:0 -10px 40px rgba(0,0,0,.5)}
#editor[hidden]{display:none}
body:has(#editor:not([hidden])) #stage{margin-bottom:58vh}
.ed-caixa{display:flex;flex-direction:column;height:100%}
.ed-topo{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:13px}
.ed-topo .esp{flex:1}
.ed-dica{font-size:11.5px;color:var(--ink-3)}
#ed-msg{font-size:11.5px;color:var(--ink-2)}
#ed-msg.erro{color:var(--neg)}
.ed-topo button,#ed-mais,.ed-tira,.ed-arq{font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.ed-topo button.pri{background:var(--orange);color:#1a1a1a;border-color:var(--orange);font-weight:600}
.ed-corpo{overflow:auto;padding:14px 18px 30px}
.ed-corpo h4{margin:16px 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.ed-grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.ed-campo{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--ink-2)}
.ed-campo textarea{font:inherit;font-size:13px;line-height:1.45;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.ed-leitura{display:grid;grid-template-columns:120px 1fr 1fr auto;gap:12px;align-items:start;margin-bottom:12px}
.ed-capa{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:11px;color:var(--ink-3)}
.ed-capa img{max-width:110px;max-height:150px;border-radius:4px}
.ed-arq input{display:none}
@media (max-width:900px){.ed-grade,.ed-leitura{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="barra">
  <h1 id="titulo-deck">Apresentação</h1>
  <select id="periodo" aria-label="Trimestre"></select>
  <select id="lang" aria-label="Idioma da carta" hidden><option value="pt">PT</option><option value="en">EN</option></select>
  <button type="button" id="prev" aria-label="Slide anterior">‹</button>
  <span id="pos"></span>
  <button type="button" id="next" aria-label="Próximo slide">›</button>
  <select id="ir" aria-label="Ir para o slide"></select>
  <span id="aviso"></span>
  <span class="esp"></span>
  <button type="button" id="btn-editar" hidden>Editar textos</button>
  <button type="button" id="btn-atualizar" title="Refaz o trimestre corrente a partir das bases do fechamento">Atualizar agora</button>
  <button type="button" id="play" title="Tela cheia (P)">Apresentar</button>
  <button type="button" id="pdf">Exportar PDF</button>
  <button type="button" id="pptx">Exportar PPTX</button>
</div>
<div id="reproc-status"></div>
<div id="stage"></div>
<div id="impressao"></div>
<div id="editor" hidden></div>
<style id="pagina-impressa"></style>

<script src="../vendor/supabase.min.js"></script>
<script src="../vendor/pptxgen.bundle.js"></script>
<script src="config.js"></script>
<script src="../reprocessar.js"></script>
<script src="ap_layout.js"></script>
<script src="ap_deck.js"></script>
<script src="ap_fonte.js"></script>
</body>
</html>
