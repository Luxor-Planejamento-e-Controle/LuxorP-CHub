<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manuais · Luxor P&amp;C</title>
<!-- Manuais de processo da pasta "Manuais" do hub (?manual=manual_backoffice). O texto
     vive em app_state e os prints no bucket `manuais`; nada disso está neste repo, que é
     público (ver mn_fonte.js). -->
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../theme.css">
<style>
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--font-sans)}
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--bg-2)}
.barra h1{font-size:15px;margin:0 8px 0 0;font-weight:600;white-space:nowrap}
.barra input{font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;width:260px;max-width:100%}
.barra .esp{flex:1}
button,.btn-arq{font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover:not(:disabled),.btn-arq:hover{border-color:var(--line-strong)}
button:disabled{opacity:.4;cursor:default}
button.prim{background:var(--orange);border-color:var(--orange);color:#0D2126;font-weight:600}
button.perigo:hover{border-color:var(--neg);color:var(--neg)}
#status{font-size:11.5px;color:var(--ink-2)}
#status.erro{color:var(--neg)}

.corpo{flex:1;min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr)}
#indice{overflow:auto;border-right:1px solid var(--line);padding:12px 10px;background:var(--bg-2)}
#indice .item{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 10px;border-radius:8px;
  color:var(--ink-2);text-decoration:none;font-size:13px;line-height:1.3}
#indice .item:hover{background:var(--surface);color:var(--ink)}
#indice .item.on{background:var(--orange-soft);color:var(--ink)}
#indice .item .per{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
#indice .sub{display:block;padding:4px 10px 4px 22px;font-size:12px;color:var(--ink-3);text-decoration:none;
  border-left:2px solid var(--line);margin-left:12px}
#indice .sub:hover{color:var(--orange)}
#indice .nada{padding:10px;color:var(--ink-3);font-size:12.5px}
#principal{overflow:auto;padding:22px 34px 60px}
#secao{max-width:980px}

.cab{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:1px solid var(--line);
  padding-bottom:14px;margin-bottom:18px}
.cab h1{font-family:var(--font-serif);font-size:24px;margin:0 0 6px;font-weight:600}
.cab .meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12px;color:var(--ink-3)}
.chip{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:var(--teal-soft);color:var(--teal-light);
  padding:3px 8px;border-radius:6px}
.acoes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.md{font-size:14px;line-height:1.6;color:var(--ink)}
.md h2{font-size:18px;margin:28px 0 10px;color:var(--orange);font-weight:600;scroll-margin-top:12px}
.md h3{font-size:15px;margin:22px 0 8px;font-weight:600}
.md h4{font-size:13.5px;margin:18px 0 6px;font-weight:600;color:var(--ink-2)}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 12px;padding-left:24px}
.md li{margin:3px 0}
.md li>ul,.md li>ol{margin:4px 0}
.md a{color:var(--orange)}
.md code{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px;background:var(--surface);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px;word-break:break-all}
.md .cod{position:relative;margin:0 0 12px}
.md .cod pre{margin:0;background:#0a1a1e;border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto}
.md .cod pre code{background:none;border:0;padding:0;white-space:pre;word-break:normal}
.md .cod .copiar{position:absolute;top:6px;right:6px;font-size:11px;padding:3px 8px;opacity:.75}
.md .cod .copiar:hover{opacity:1}
.md blockquote{margin:0 0 12px;padding:10px 14px;border-left:3px solid var(--orange);background:var(--orange-soft);
  border-radius:0 8px 8px 0}
.md blockquote p:last-child{margin:0}
.md hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.md .tab{overflow:auto;margin:0 0 14px}
.md table{border-collapse:collapse;font-size:13px;min-width:60%}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--surface);font-weight:600}
.md figure{margin:6px 0 16px}
.md img{max-width:100%;border:1px solid var(--line);border-radius:6px;cursor:zoom-in;background:#fff}
.md figcaption{font-size:12px;color:var(--ink-3);margin-top:4px}
.md .img-falta{display:inline-block;font-size:12px;color:var(--warn);border:1px dashed var(--warn);border-radius:6px;padding:6px 10px}

.vazio{padding:60px 0;color:var(--ink-2)}
.vazio h2{font-family:var(--font-serif);color:var(--ink)}

.ed-campos{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
.ed-campos label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--ink-3)}
.ed-campos input,.ed-campos select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:7px 10px}
#ed-titulo{width:380px;max-width:80vw}
.ed-bot{display:flex;gap:8px;margin-left:auto;align-items:center}
.ed-lados{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:calc(100vh - 230px);min-height:360px}
#ed-md{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px;line-height:1.5;color:var(--ink);
  background:#0a1a1e;border:1px solid var(--line);border-radius:8px;padding:12px;resize:none}
#ed-previa{overflow:auto;border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.ed-ajuda{font-size:11px;color:var(--ink-3);margin-top:8px}
#secao:has(.ed){max-width:none}

#zoom{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;
  z-index:10;cursor:zoom-out;padding:24px}
#zoom[hidden]{display:none}
#zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:4px}

@media (max-width:760px){
  .corpo{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #indice{max-height:30vh;border-right:0;border-bottom:1px solid var(--line)}
  #principal{padding:16px}
  .cab{flex-direction:column}
  .ed-lados{grid-template-columns:1fr;height:auto}
  #ed-md{min-height:50vh}
  .barra input{width:100%}
}
@media print{
  body{overflow:visible;background:#fff;color:#000}
  .barra,#indice,.acoes,.copiar{display:none!important}
  .corpo{display:block}
  #principal{overflow:visible;padding:0}
  .md,.cab h1{color:#000}
  .md .cod pre{background:#f4f4f4}
}
</style>
</head>
<body>
<div class="barra">
  <h1 id="titulo">Manual</h1>
  <input id="busca" type="search" placeholder="Buscar no manual (script, caminho, passo…)" aria-label="Buscar no manual">
  <span id="status" role="status"></span>
  <span class="esp"></span>
  <button type="button" id="nova" hidden>Nova seção</button>
</div>
<div class="corpo">
  <nav id="indice" aria-label="Seções do manual"></nav>
  <main id="principal"><div id="secao"><div class="vazio">Carregando…</div></div></main>
</div>
<div id="zoom" hidden><img alt=""></div>
<script src="../vendor/supabase.min.js"></script>
<script src="config.js"></script>
<script src="mn_md.js"></script>
<script src="mn_fonte.js"></script>
<script src="mn_app.js"></script>
</body>
</html>
