/* Barra de formatação (o Trello tem uma no editor): envolve a seleção na marcação. */
const FMT = [['b', 'Negrito', '<b>B</b>'], ['i', 'Itálico', '<i>I</i>'], ['s', 'Riscado', '<s>S</s>'],
             ['h', 'Título', 'T'], ['link', 'Link', svg('link', 13)], ['ul', 'Lista', '•'],
             ['ol', 'Lista numerada', '1.'], ['q', 'Citação', '❝'], ['code', 'Código', '&lt;/&gt;'],
             ['hr', 'Linha divisória', '—']];
function barraFmt(alvo) {
  return `<div class="fmt" data-alvo="${alvo}">${FMT.map(([k, t, r]) =>
    `<button type="button" data-fmt="${k}" title="${t}" aria-label="${t}">${r}</button>`).join('')}</div>`;
}
function aplicarFmt(el, k) {
  const ini = el.selectionStart, fim = el.selectionEnd, sel = el.value.slice(ini, fim);
  const envolver = (a, b, padrao) => {
    const t = sel || padrao;
    el.setRangeText(a + t + b, ini, fim, 'select');
    el.setSelectionRange(ini + a.length, ini + a.length + t.length);
  };
  const porLinha = prefixo => {
    const ls = (sel || 'texto').split('\n').map((l, i) => (typeof prefixo === 'function' ? prefixo(i) : prefixo) + l);
    el.setRangeText(ls.join('\n'), ini, fim, 'end');
  };
  if (k === 'b') envolver('**', '**', 'negrito');
  else if (k === 'i') envolver('_', '_', 'itálico');
  else if (k === 's') envolver('~~', '~~', 'riscado');
  else if (k === 'code') envolver('`', '`', 'código');
  else if (k === 'link') { const u = prompt('Endereço do link (https://…)', 'https://'); if (!u || !/^https?:\/\//i.test(u)) return; envolver('[', '](' + u + ')', 'texto do link'); }
  else if (k === 'h') porLinha('### ');
  else if (k === 'ul') porLinha('- ');
  else if (k === 'ol') porLinha(i => (i + 1) + '. ');
  else if (k === 'q') porLinha('> ');
  else if (k === 'hr') el.setRangeText('\n\n---\n\n', ini, fim, 'end');
  el.focus();
  el.dispatchEvent(new Event('input', { bubbles: true }));
}

/* Imagens coladas e links para anexo: o bucket é privado, então o endereço é
   assinado na hora (vale 5 minutos) e guardado enquanto vale. */
const URLS = new Map();
async function urlDe(caminho) {
  const c = URLS.get(caminho);
  if (c && c.ate > Date.now()) return c.url;
  const url = await KB_FONTE.urlArquivo(caminho);
  URLS.set(caminho, { url, ate: Date.now() + 240e3 });
  return url;
}
function hidratar(raiz) {
  $$('.kb-img[data-anexo]', raiz).forEach(async el => {
    try {
      const url = await urlDe(el.dataset.anexo);
      // clicar abre no visualizador, como a imagem colada no Trello
      const img = document.createElement('img');
      img.src = url; img.alt = el.title || ''; img.loading = 'lazy';
      img.className = 'kb-ver'; img.dataset.anexo = el.dataset.anexo; img.dataset.nome = el.title || 'imagem';
      el.replaceWith(img);
    } catch (e) { el.textContent = el.title || 'imagem'; }
  });
  $$('.kb-thumb[data-anexo], .kb-capa[data-anexo]', raiz).forEach(async el => {
    try {
      const img = document.createElement('img');
      img.src = await urlDe(el.dataset.anexo); img.alt = ''; img.loading = 'lazy';
      el.replaceWith(img);
    } catch (e) { el.textContent = 'img'; }
  });
}
// janela aberta já no clique (senão o bloqueador de pop-up barra), endereço preenchido depois
async function abrirArquivo(caminho, nomeParaBaixar) {
  const w = nomeParaBaixar ? null : window.open('', '_blank');
  try {
    const url = nomeParaBaixar ? await KB_FONTE.urlArquivo(caminho, nomeParaBaixar) : await urlDe(caminho);
    if (w) { w.opener = null; w.location = url; }
    else { const a = document.createElement('a'); a.href = url; a.download = nomeParaBaixar; document.body.appendChild(a); a.click(); a.remove(); }
  } catch (e) { if (w) w.close(); toast(e.message, true); }
}

/* ---------- visualizador de anexos ----------
   Imagem e PDF abrem aqui mesmo, por cima do card, com setas entre os anexos — como
   no Trello. Outros tipos (planilha, Word) não têm prévia no navegador: botão Baixar. */
let visor = null;          // { itens: [{nome, caminho, mime}], i }
function abrirVisor(itens, i) { visor = { itens, i: Math.max(0, i) }; desenharVisor(); }
function fecharVisor() { visor = null; $('#visor').innerHTML = ''; }
const ehPdf = it => /pdf/i.test(it.mime || '') || /\.pdf$/i.test(it.nome || '');
async function desenharVisor() {
  const v = visor;
  if (!v) return fecharVisor();
  const it = v.itens[v.i];
  $('#visor').innerHTML = `<div class="visor" role="dialog" aria-modal="true" aria-label="${esc(it.nome)}">
    <div class="visor-barra"><span class="nm">${esc(it.nome)}</span>
      ${v.itens.length > 1 ? `<span class="sub">${v.i + 1} de ${v.itens.length}</span>` : ''}
      <span style="flex:1"></span>
      <button class="btn btn-mini" data-v="baixar" type="button">Baixar</button>
      <button class="btn btn-mini" data-v="aba" type="button">Abrir em outra aba</button>
      <button class="ico-btn" data-v="fechar" type="button" aria-label="Fechar">${svg('x', 18)}</button></div>
    <div class="visor-corpo" data-v="fundo"><div class="sync">Carregando…</div></div>
    ${v.itens.length > 1 ? `<button class="visor-nav ant" data-v="ant" type="button" aria-label="Anterior">${svg('esq', 26)}</button>
      <button class="visor-nav prox" data-v="prox" type="button" aria-label="Próximo">${svg('dir', 26)}</button>` : ''}
  </div>`;
  const corpo = $('.visor-corpo');
  try {
    const url = await urlDe(it.caminho);
    if (visor !== v || v.itens[v.i] !== it) return;
    if (KB.ehImagem(it.mime, it.nome)) {
      const img = document.createElement('img'); img.src = url; img.alt = it.nome;
      corpo.innerHTML = ''; corpo.appendChild(img);
    } else if (ehPdf(it)) {
      const f = document.createElement('iframe'); f.src = url; f.title = it.nome;
      corpo.innerHTML = ''; corpo.appendChild(f);
    } else {
      corpo.innerHTML = `<div class="sem-previa"><div class="big">${esc(extensao(it.nome).toUpperCase())}</div>
        <div>Este tipo de arquivo não abre no navegador.</div>
        <button class="btn-acao" data-v="baixar" type="button" style="margin-top:12px">Baixar</button></div>`;
    }
  } catch (e) { corpo.textContent = e.message; }
}
$('#visor').addEventListener('click', ev => {
  const b = ev.target.closest('[data-v]');
  if (!b || !visor) return;
  const it = visor.itens[visor.i], q = b.dataset.v;
  if (q === 'fechar' || (q === 'fundo' && ev.target === b)) fecharVisor();
  else if (q === 'baixar') abrirArquivo(it.caminho, it.nome);
  else if (q === 'aba') abrirArquivo(it.caminho);
  else if (q === 'ant' || q === 'prox') {
    visor.i = (visor.i + (q === 'prox' ? 1 : -1) + visor.itens.length) % visor.itens.length;
    desenharVisor();
  }
});
document.addEventListener('keydown', ev => {
  if (!visor) return;
  if (ev.key === 'Escape') { ev.stopImmediatePropagation(); fecharVisor(); }
  else if ((ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') && visor.itens.length > 1) {
    visor.i = (visor.i + (ev.key === 'ArrowRight' ? 1 : -1) + visor.itens.length) % visor.itens.length;
    desenharVisor();
  }
}, true);
function arquivosDoCard() {
  return (S.aberto ? S.aberto.anexos : []).filter(a => a.caminho).map(a => ({ nome: a.nome, caminho: a.caminho, mime: a.mime }));
}

/* ---------- arrastar itens de checklist ----------
   Reordena e muda de checklist (dentro do mesmo card), como no Trello. Grava só o item:
   posição entre os vizinhos e, se mudou, o checklist. */
let arrastadoItem = null;
const phItem = document.createElement('div');
phItem.className = 'ph-item';
$('#modal').addEventListener('dragstart', ev => {
  const it = ev.target.closest && ev.target.closest('.item[data-item]');
  if (!it || ev.target.closest('textarea, input')) return;
  arrastadoItem = it.dataset.item;
  phItem.style.height = it.offsetHeight + 'px';
  ev.dataTransfer.effectAllowed = 'move';
  try { ev.dataTransfer.setData('text/plain', 'item:' + arrastadoItem); } catch (e) {}
  requestAnimationFrame(() => it.classList.add('arrastando'));
});
$('#modal').addEventListener('dragend', () => {
  $$('.item.arrastando').forEach(x => x.classList.remove('arrastando'));
  if (phItem.parentNode) phItem.parentNode.removeChild(phItem);
  arrastadoItem = null;
});
$('#modal').addEventListener('dragover', ev => {
  if (!arrastadoItem) return;
  const ovl = $('#ovl');
  if (ovl && ev.clientY < 70) ovl.scrollTop -= 16;                    // perto da borda: rola
  else if (ovl && ev.clientY > innerHeight - 70) ovl.scrollTop += 16;
  const ckl = ev.target.closest('.ckl');
  if (!ckl) return;
  ev.preventDefault();
  const itens = $$('.item[data-item]:not(.arrastando)', ckl);
  const depois = itens.find(el => { const r = el.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; });
  if (depois) depois.before(phItem);
  else if (itens.length) itens[itens.length - 1].after(phItem);
  else $('.ckl-bar', ckl).after(phItem);
});
$('#modal').addEventListener('drop', async ev => {
  if (!arrastadoItem || !phItem.parentNode || !S.aberto) return;
  ev.preventDefault();
  const id = arrastadoItem, ckl = phItem.closest('.ckl'), cklId = ckl.dataset.ckl;
  const todos = S.aberto.checklists.flatMap(k => k.itens);
  const fila = $$('.item[data-item], .ph-item', ckl).filter(e => e === phItem || e.dataset.item !== id);
  const k = fila.indexOf(phItem);
  const prev = fila[k - 1] && todos.find(x => x.id === fila[k - 1].dataset.item);
  const prox = fila[k + 1] && todos.find(x => x.id === fila[k + 1].dataset.item);
  const it = todos.find(x => x.id === id);
  phItem.remove();
  let pos = KB.posEntre(prev ? prev.pos : null, prox ? prox.pos : null);
  if (pos === null) {                       // sem espaço: renumera o checklist de destino
    const ordem = S.aberto.checklists.find(x => x.id === cklId).itens.filter(x => x.id !== id);
    ordem.splice(prox ? ordem.indexOf(prox) : ordem.length, 0, it);
    const ps = KB.renumerar(ordem.length);
    await tentar(async () => {
      for (let i = 0; i < ordem.length; i++) {
        await KB_FONTE.atualizarItem(ordem[i].id, i === ordem.indexOf(it) ? { pos: ps[i], checklist_id: cklId } : { pos: ps[i] });
      }
    }, false);
  } else {
    await tentar(() => KB_FONTE.atualizarItem(id, { pos, checklist_id: cklId }), false);
  }
  await recarregarTudo();
});

/* ---------- cliques na janela do card ---------- */
$('#modal').addEventListener('click', async ev => {
  if (ev.target.id === 'ovl') { if (!emEdicao()) fecharCard(); return; }
  if (ev.target.closest('#btFechar')) { fecharCard(); return; }
  const fmt = ev.target.closest('[data-fmt]');
  if (fmt) {
    const alvo = document.getElementById(fmt.closest('.fmt').dataset.alvo);
    if (alvo) aplicarFmt(alvo, fmt.dataset.fmt);
    return;
  }
  const lk = ev.target.closest('.kb-anexo-link');
  const ver = ev.target.closest('.kb-ver');
  if (lk || ver) {
    ev.preventDefault();
    const caminho = (lk || ver).dataset.anexo;
    const lista = arquivosDoCard(), k = lista.findIndex(x => x.caminho === caminho);
    if (k >= 0) abrirVisor(lista, k);
    else abrirVisor([{ nome: ver ? ver.dataset.nome : lk.textContent, caminho, mime: ver ? 'image/png' : '' }], 0);
    return;
  }
  const el = ev.target.closest('[data-a]');
  if (!el || !S.aberto) return;
  const A = S.aberto, c = A.card, a = el.dataset.a;
  const itemEl = el.closest('[data-item]'), cklEl = el.closest('[data-ckl]');
  const itemId = el.dataset.item || (itemEl && itemEl.dataset.item), cklId = cklEl && cklEl.dataset.ckl;
  const anexo = el.closest('[data-anexo-id]') && A.anexos.find(x => x.id === el.closest('[data-anexo-id]').dataset.anexoId);
  const coment = el.closest('[data-coment]') && A.comentarios.find(x => x.id === el.closest('[data-coment]').dataset.coment);

  switch (a) {
    case 'membros': return popMembros(el);
    case 'etiquetas': return popEtiquetas(el);
    case 'prazo': return popPrazo(el);
    case 'checklist': return popChecklist(el);
    case 'anexo': return popAnexo(el);
    case 'mover': return popMover(el);
    case 'copiar': return popCopiar(el);
    case 'arquivar': return arquivarCard(c.id);
    case 'restaurar': return restaurarCard(c);
    case 'link': return copiarLink(c.id);
    case 'seguir':
      if (!S.eu.membroId) return toast('Seu login ainda não é membro do board — recarregue a página.', true);
      await tentar(() => KB_FONTE.seguir(c.id, S.eu.membroId, !eSigo(c)), false);
      return recarregarTudo();
    case 'capa':
      await tentar(() => KB_FONTE.definirCapa(c.id, anexo.id), false);
      return recarregarTudo();
    case 'tirar-capa':
      await tentar(() => KB_FONTE.definirCapa(c.id, null), false);
      return recarregarTudo();
    case 'ocultar-feitos':
      S.ocultarFeitos[cklId] = !S.ocultarFeitos[cklId];
      return renderCard();
    case 'converter-item': {
      const it = A.checklists.flatMap(x => x.itens).find(x => x.id === itemId);
      // abaixo do card de onde saiu, na mesma lista (ou no fim, se ele estiver arquivado)
      const ordem = cardsDaLista(c.lista_id), k = ordem.findIndex(x => x.id === c.id);
      const pos = k < 0 ? (ordem.length ? ordem[ordem.length - 1].pos + KB.PASSO : KB.PASSO)
        : (KB.posEntre(c.pos, ordem[k + 1] ? ordem[k + 1].pos : null) || c.pos + 1);
      const novo = await tentar(() => KB_FONTE.converterItem(it, c.lista_id, pos), false);
      await recarregarTudo();
      if (novo) toast('Item virou card.', false, { rotulo: 'Abrir', fn: () => abrirCard(novo) });
      return;
    }
    case 'excluir':
      if (!confirm(`Excluir de vez o card "${c.nome}"? Comentários, checklists e anexos vão junto. Não dá para desfazer.`)) return;
      await tentar(() => KB_FONTE.excluirCard(c.id));
      fecharCard(); toast('Card excluído.');
      return;
    case 'editar-desc': editandoDesc = true; return renderCard();
    case 'cancelar-desc': editandoDesc = false; renderCard(); return depoisDeEditar();
    case 'salvar-desc': {
      const v = $('#inDesc').value;
      editandoDesc = false;
      return mudarCard({ descricao: v });
    }
    case 'detalhes':
      S.detalhes = !S.detalhes;
      try { localStorage.setItem('kanban.detalhes', S.detalhes ? '1' : '0'); } catch (e) {}
      return renderCard();
    case 'comentar': {
      const t = $('#novoComent'), v = t.value.trim();
      if (!v) { t.focus(); return; }
      t.value = '';
      await tentar(() => KB_FONTE.comentar(c.id, v), false);
      return recarregarTudo();
    }
    case 'editar-coment': editandoComentario = coment.id; return renderCard();
    case 'cancelar-coment': editandoComentario = null; renderCard(); return depoisDeEditar();
    case 'salvar-coment': {
      const v = $('#inComent').value.trim();
      if (!v) return;
      editandoComentario = null;
      await tentar(() => KB_FONTE.editarComentario(coment.id, v), false);
      return recarregarTudo();
    }
    case 'excluir-coment':
      if (!confirm('Excluir este comentário?')) return;
      await tentar(() => KB_FONTE.excluirComentario(coment.id), false);
      return recarregarTudo();
    case 'marcar': {
      const it = A.checklists.flatMap(x => x.itens).find(x => x.id === itemId);
      it.concluido = el.checked;
      await tentar(() => KB_FONTE.atualizarItem(itemId, { concluido: el.checked }), false);
      return recarregarTudo();
    }
    case 'editar-item': editandoItem = itemId; return renderCard();
    case 'cancelar-item': editandoItem = null; renderCard(); return depoisDeEditar();
    case 'salvar-item': {
      const v = $('#inItem').value.trim();
      editandoItem = null;
      if (!v) return renderCard();
      await tentar(() => KB_FONTE.atualizarItem(el.dataset.item, { nome: v }), false);
      return recarregarTudo();
    }
    case 'excluir-item':
      await tentar(() => KB_FONTE.excluirItem(itemId), false);
      return recarregarTudo();
    case 'membro-item': return popMembroItem(el, itemId);
    case 'novo-item': addItemEm = cklId; return renderCard();
    case 'cancelar-novo-item': addItemEm = null; renderCard(); return depoisDeEditar();
    case 'salvar-novo-item': return salvarNovoItem();
    case 'renomear-ckl': renomeandoCkl = cklId; return renderCard();
    case 'excluir-ckl': {
      const cl = A.checklists.find(x => x.id === cklId);
      if (!confirm(`Excluir o checklist "${cl.nome}"${cl.itens.length ? ` e seus ${cl.itens.length} itens` : ''}?`)) return;
      await tentar(() => KB_FONTE.excluirChecklist(cklId), false);
      return recarregarTudo();
    }
    case 'abrir-anexo': {
      if (!anexo.caminho) return window.open(anexo.url, '_blank', 'noopener');
      const lista = arquivosDoCard();
      return abrirVisor(lista, lista.findIndex(x => x.caminho === anexo.caminho));
    }
    case 'tornar-modelo':
      return mudarCard({ modelo: !c.modelo }, c.modelo ? 'O card deixou de ser modelo.' : 'Card virou modelo.');
    case 'criar-do-modelo': return popCopiar(el, true);
    case 'reagir': {
      const e = el.dataset.emoji;
      const meu = (coment.kanban_reacoes || []).some(r => r.emoji === e && r.autor_email === S.eu.email);
      await tentar(() => KB_FONTE.reagir(coment.id, e, !meu, S.eu.email), false);
      return recarregarTudo();
    }
    case 'add-reacao':
      return abrirPop(el, 'Reagir', () => `<div class="emojis">${EMOJIS.map(e =>
        `<button type="button" data-emoji="${esc(e)}" aria-label="${esc(e)}">${esc(e)}</button>`).join('')}</div>`,
        corpo => corpo.addEventListener('click', async e2 => {
          const b = e2.target.closest('[data-emoji]'); if (!b) return;
          fecharPop();
          const ja = (coment.kanban_reacoes || []).some(r => r.emoji === b.dataset.emoji && r.autor_email === S.eu.email);
          if (!ja) await tentar(() => KB_FONTE.reagir(coment.id, b.dataset.emoji, true, S.eu.email), false);
          await recarregarTudo();
        }));
    case 'baixar-anexo': return abrirArquivo(anexo.caminho, anexo.nome);
    case 'renomear-anexo': {
      const nome = prompt('Nome do anexo', anexo.nome);
      if (!nome || !nome.trim() || nome.trim() === anexo.nome) return;
      await tentar(() => KB_FONTE.renomearAnexo(anexo.id, nome.trim()), false);
      return recarregarTudo();
    }
    case 'excluir-anexo':
      if (!confirm(`Excluir o anexo "${anexo.nome}"? Não dá para desfazer.`)) return;
      await tentar(() => KB_FONTE.excluirAnexo(anexo), false);
      return recarregarTudo();
  }
});

$('#modal').addEventListener('change', ev => {
  if (!S.aberto) return;
  if (ev.target.id === 'mLista') {
    const destino = ev.target.value;
    const ult = cardsDaLista(destino).filter(x => x.id !== S.aberto.card.id).slice(-1)[0];
    return mudarCard({ lista_id: destino, pos: ult ? ult.pos + KB.PASSO : KB.PASSO });
  }
  if (ev.target.id === 'mPrazoOk') return mudarCard({ prazo_concluido: ev.target.checked });
});
$('#modal').addEventListener('input', ev => { if (ev.target.id === 'titulo') autoAltura(ev.target); });
$('#modal').addEventListener('keydown', ev => {
  const id = ev.target.id;
  if (id === 'titulo' && ev.key === 'Enter') { ev.preventDefault(); ev.target.blur(); }
  if (id === 'titulo' && ev.key === 'Escape') { ev.stopPropagation(); ev.target.value = ev.target.dataset.orig; ev.target.blur(); }
  if (id === 'novoComent' && ev.key === 'Escape') { ev.stopPropagation(); ev.target.blur(); }
  if (id === 'inNovoItem' && ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); salvarNovoItem(); }
  if (id === 'inItem' && ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); $('[data-a="salvar-item"]').click(); }
  if (id === 'inCkl' && ev.key === 'Enter') { ev.preventDefault(); ev.target.blur(); }
  if (['inNovoItem', 'inItem', 'inCkl', 'inDesc', 'inComent'].includes(id) && ev.key === 'Escape') {
    ev.stopPropagation();
    addItemEm = editandoItem = renomeandoCkl = editandoComentario = null; editandoDesc = false;
    renderCard(); depoisDeEditar();
  }
  if (id === 'novoComent' && ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); $('[data-a="comentar"]').click(); }
});
$('#modal').addEventListener('focusout', ev => {
  if (!S.aberto) return;
  if (ev.target.id === 'titulo') {
    const v = ev.target.value.replace(/\s*\n\s*/g, ' ').trim();
    if (!v) { ev.target.value = S.aberto.card.nome; return; }
    if (v !== S.aberto.card.nome) mudarCard({ nome: v });
  }
  if (ev.target.id === 'inCkl' && renomeandoCkl) {
    const id = renomeandoCkl, v = ev.target.value.trim();
    renomeandoCkl = null;
    const cl = S.aberto.checklists.find(x => x.id === id);
    if (v && cl && v !== cl.nome) tentar(() => KB_FONTE.renomearChecklist(id, v), false).then(recarregarTudo);
    else { renderCard(); depoisDeEditar(); }
  }
});

/* ---------- @menção: sugestão ao digitar ----------
   Lista quem tem login (e por isso recebe o aviso no Slack) e o @card, que avisa todos
   os membros do card — como no Trello. Insere o @usuario, que é o que o banco procura. */
const CAMPOS_TEXTO = ['novoComent', 'inComent', 'inDesc'];
let mencao = null;          // { el, ini, itens, sel }
function fecharMencao() { mencao = null; $('#mencoes').innerHTML = ''; }
function checarMencao(el) {
  const antes = el.value.slice(0, el.selectionStart);
  const m = /(^|[\s(>])@([A-Za-z0-9_]*)$/.exec(antes);
  if (!m) return fecharMencao();
  const q = KB.normal(m[2]);
  const itens = [{ usuario: 'card', nome: 'card', sub: 'todos os membros do card' }]
    .concat(S.membros.filter(x => x.usuario && x.email).map(x => ({ usuario: x.usuario, nome: x.nome, email: x.email, sub: '@' + x.usuario })))
    .filter(o => !q || KB.normal(o.nome).includes(q) || KB.normal(o.usuario).includes(q))
    .slice(0, 8);
  if (!itens.length) return fecharMencao();
  const sel = mencao && mencao.el === el ? Math.min(mencao.sel, itens.length - 1) : 0;
  mencao = { el, ini: antes.length - m[2].length - 1, itens, sel };
  const r = el.getBoundingClientRect();
  $('#mencoes').innerHTML = `<div class="mencoes" style="left:${Math.min(r.left, innerWidth - 330)}px;top:${Math.min(r.bottom + 4, innerHeight - 280)}px">
    ${itens.map((o, i) => `<div class="opt${i === sel ? ' on' : ''}" data-i="${i}">${o.usuario === 'card' ? '<span class="av" style="background:var(--surface-3)">@</span>' : avatarNome(o.nome, false, o.email)}
      <span>${esc(o.nome)} <span class="sub">${esc(o.sub)}</span></span></div>`).join('')}</div>`;
}
function escolherMencao(i) {
  const { el, ini, itens } = mencao, o = itens[i], fim = el.selectionStart;
  el.value = el.value.slice(0, ini) + '@' + o.usuario + ' ' + el.value.slice(fim);
  const p = ini + o.usuario.length + 2;
  fecharMencao();
  el.focus(); el.setSelectionRange(p, p);
}
$('#mencoes').addEventListener('mousedown', ev => {
  const o = ev.target.closest('[data-i]'); if (!o) return;
  ev.preventDefault();                       // não tira o foco do texto
  escolherMencao(+o.dataset.i);
});
$('#modal').addEventListener('input', ev => { if (CAMPOS_TEXTO.includes(ev.target.id)) checarMencao(ev.target); });
$('#modal').addEventListener('keydown', ev => {
  if (!mencao || ev.target !== mencao.el) return;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault(); ev.stopPropagation();
    mencao.sel = (mencao.sel + (ev.key === 'ArrowDown' ? 1 : -1) + mencao.itens.length) % mencao.itens.length;
    checarMencao(ev.target);
  } else if (ev.key === 'Enter' || ev.key === 'Tab') {
    ev.preventDefault(); ev.stopPropagation(); escolherMencao(mencao.sel);
  } else if (ev.key === 'Escape') {
    ev.preventDefault(); ev.stopPropagation(); fecharMencao();
  }
}, true);
$('#modal').addEventListener('focusout', ev => { if (mencao && ev.target === mencao.el) setTimeout(fecharMencao, 150); });

/* ---------- print colado e arquivo arrastado ----------
   Ctrl+V de imagem num texto: vira anexo do card e entra no texto como imagem, que é o
   que o Trello fazia (127 prints colados no histórico do board). */
async function enviarImagens(arquivos, el) {
  const c = S.aberto && S.aberto.card;
  if (!c) return;
  let pos = (S.aberto.anexos.slice(-1)[0] || { pos: 0 }).pos;
  for (const f of arquivos) {
    pos += KB.PASSO;
    const nome = f.name && f.name !== 'image.png' ? f.name : 'image.png';
    const ini = el ? el.selectionStart : 0;
    const marca = el ? `![enviando ${nome}…]()` : '';
    if (el) el.setRangeText(marca, ini, el.selectionEnd, 'end');
    try {
      const p = pos;
      const caminho = await KB_FONTE.anexar(c.id, f, p, nome);
      if (el) {
        const i = el.value.indexOf(marca);
        const md = `![${nome}](anexo:${caminho})`;
        if (i >= 0) el.value = el.value.slice(0, i) + md + el.value.slice(i + marca.length);
        else el.setRangeText(md, el.selectionStart, el.selectionEnd, 'end');
      }
    } catch (e) {
      if (el) el.value = el.value.replace(marca, '');
      toast(e.message, true);
    }
  }
  if (!el) await recarregarTudo();
}
$('#modal').addEventListener('paste', ev => {
  if (!CAMPOS_TEXTO.includes(ev.target.id)) return;
  const imgs = Array.from((ev.clipboardData && ev.clipboardData.files) || []).filter(f => /^image\//.test(f.type));
  if (!imgs.length) return;
  ev.preventDefault();
  enviarImagens(imgs, ev.target);
});
$('#modal').addEventListener('dragover', ev => {
  if (S.aberto && ev.dataTransfer && Array.from(ev.dataTransfer.types || []).includes('Files')) ev.preventDefault();
});
$('#modal').addEventListener('drop', async ev => {
  const arqs = Array.from((ev.dataTransfer && ev.dataTransfer.files) || []);
  if (!S.aberto || !arqs.length) return;
  ev.preventDefault();
  if (CAMPOS_TEXTO.includes(ev.target.id) && arqs.every(f => /^image\//.test(f.type))) return enviarImagens(arqs, ev.target);
  let pos = (S.aberto.anexos.slice(-1)[0] || { pos: 0 }).pos;
  for (const f of arqs) { pos += KB.PASSO; const p = pos; await tentar(() => KB_FONTE.anexar(S.aberto.card.id, f, p), false); }
  await recarregarTudo();
  toast(arqs.length === 1 ? 'Arquivo anexado.' : `${arqs.length} arquivos anexados.`);
});

const LEMBRETES = [['', '1 dia antes (padrão)'], ['-1', 'Nenhum'], ['0', 'Na hora do prazo'],

      ${c.prazo || c.inicio ? '<button class="btn btn-mini" data-p="remover" type="button">Remover datas</button>' : ''}</div>`,

      const destino = $('#inCpLista').value, topo = $('#inCpPos').value === 'topo';
      const outros = cardsDaLista(destino);
      const pos = topo ? (outros[0] ? outros[0].pos / 2 : KB.PASSO) : (outros.length ? outros[outros.length - 1].pos + KB.PASSO : KB.PASSO);
      const manter = { checklists: $('#cpCkl').checked, etiquetas: $('#cpEtq').checked, membros: $('#cpMbr').checked,
                       anexos: $('#cpAnx').checked, comentarios: $('#cpCom').checked };
      fecharPop();
      const novo = await tentar(() => KB_FONTE.copiarCard(c.id, nome, destino, pos, manter));
      if (novo) { toast(doModelo ? 'Card criado a partir do modelo.' : 'Cópia criada.'); abrirCard(novo); }
    }));
}

/* ============================================================
   GAVETA: arquivados e atividade do board
   ============================================================ */
let gaveta = null;     // { tipo:'arq'|'atv', ... }
function fecharGaveta() { gaveta = null; $('#gaveta').innerHTML = ''; }
function desenharGaveta(titulo, corpo) {
  $('#gaveta').innerHTML = `<aside class="gaveta" role="dialog" aria-label="${esc(titulo)}">
    <div class="gaveta-head"><h3>${esc(titulo)}</h3><button class="ico-btn" id="btFecharGav" type="button" aria-label="Fechar">${svg('x', 16)}</button></div>
    <div class="gaveta-corpo">${corpo}</div></aside>`;
  $('#btFecharGav').onclick = fecharGaveta;
}

async function abrirArquivados() {
  gaveta = { tipo: 'arq', aba: 'cards', busca: '', itens: null };
  desenharArquivados();
  await atualizarArquivados();
}
// relê mantendo aba e busca: restaurar ou arquivar um card muda a lista da gaveta
async function atualizarArquivados() {
  if (!gaveta || gaveta.tipo !== 'arq') return;
  try {
    gaveta.itens = await KB_FONTE.arquivados(S.listas.filter(l => l.arquivada).map(l => l.id));
    desenharArquivados();
  } catch (e) { toast(e.message, true); }
}
function desenharArquivados() {
  if (!gaveta || gaveta.tipo !== 'arq') return;
  const g = gaveta;
  const busca = KB.normal(g.busca);
  let corpo = `<div class="abas"><button class="btn btn-mini${g.aba === 'cards' ? ' on' : ''}" data-aba="cards" type="button">Cards</button>
    <button class="btn btn-mini${g.aba === 'listas' ? ' on' : ''}" data-aba="listas" type="button">Listas</button></div>`;
  if (g.aba === 'listas') {
    const ls = S.listas.filter(l => l.arquivada);
    corpo += ls.length ? ls.map(l => `<div class="arq"><div class="info"><div class="nome">${esc(l.nome)}</div>
        <div class="sub">${(g.itens || []).filter(c => c.lista_id === l.id).length} cards</div></div>
        <div class="acoes"><button class="btn btn-mini" data-rl="${esc(l.id)}" type="button">Restaurar</button></div></div>`).join('')
      : '<div class="empty" style="padding:30px 0">Nenhuma lista arquivada.</div>';
  } else {
    corpo += `<input class="busca" id="inBuscaArq" type="search" placeholder="Buscar nos arquivados" value="${esc(g.busca)}" style="width:100%;margin-bottom:10px">`;
    if (!g.itens) corpo += '<div class="sync">Carregando…</div>';
    else {
      // título na hora; o resto (descrição, comentários, checklists) vem da busca do banco
      const onde = new Map((g.achados && g.achados.q === g.busca.trim() ? g.achados.itens : []).map(x => [x.card_id, x.onde]));
      const vis = g.itens.filter(c => !busca || KB.normal(c.nome).includes(busca) || onde.has(c.id))
        .map(c => Object.assign({}, c, { onde: busca && !KB.normal(c.nome).includes(busca) ? onde.get(c.id) : null }));
      corpo += `<div class="sync" style="margin-bottom:8px">${vis.length} de ${g.itens.length}</div>`
        + vis.slice(0, 300).map(c => {
          const l = IX.lista.get(c.lista_id);
          return `<div class="arq"><div class="info"><div class="nome" data-abrir="${esc(c.id)}">${esc(c.nome)}</div>
            <div class="sub">${esc(l ? l.nome : '?')}${l && l.arquivada ? ' (lista arquivada)' : ''}${c.arquivado_em ? ' · arquivado em ' + esc(KB.dataCurta(c.arquivado_em)) : ''}${c.onde ? ' · achado no ' + esc(c.onde) : ''}</div></div>
            <div class="acoes"><button class="btn btn-mini" data-abrir="${esc(c.id)}" type="button">Abrir</button></div></div>`;
        }).join('')
        + (vis.length > 300 ? '<div class="sync">Mostrando os 300 mais recentes. Use a busca para achar os outros.</div>' : '');
    }
  }
  const foco = document.activeElement && document.activeElement.id === 'inBuscaArq';
  const pos = foco ? document.activeElement.selectionStart : null;
  desenharGaveta('Arquivados', corpo);
  if (foco) { const i = $('#inBuscaArq'); i.focus(); i.setSelectionRange(pos, pos); }
}
let tBuscaArq = null;
$('#gaveta').addEventListener('input', ev => {
  if (ev.target.id !== 'inBuscaArq' || !gaveta) return;
  gaveta.busca = ev.target.value;
  desenharArquivados();
  clearTimeout(tBuscaArq);
  const q = gaveta.busca.trim();
  if (q.length < 3) return;
  tBuscaArq = setTimeout(async () => {
    try {
      const r = await KB_FONTE.buscar(q, 300);
      if (!gaveta || gaveta.tipo !== 'arq' || gaveta.busca.trim() !== q) return;
      gaveta.achados = { q, itens: r };
      desenharArquivados();
    } catch (e) { console.warn('[kanban] busca:', e.message); }
  }, 350);
});
$('#gaveta').addEventListener('click', async ev => {
  const ab = ev.target.closest('[data-aba]');
  if (ab) { gaveta.aba = ab.dataset.aba; return desenharArquivados(); }
  const o = ev.target.closest('[data-abrir]');
  if (o) return abrirCard(o.dataset.abrir);
  const rl = ev.target.closest('[data-rl]');
  if (rl) return tentar(() => KB_FONTE.atualizarLista(rl.dataset.rl, { arquivada: false }));
  const mais = ev.target.closest('#btMaisAtv');
  if (mais) return carregarAtividade();
});

async function abrirAtividade() {
  gaveta = { tipo: 'atv', itens: [], fim: false, carregando: false };
  desenharAtividade();
  await carregarAtividade();
}
async function carregarAtividade() {
  const g = gaveta;
  if (!g || g.tipo !== 'atv' || g.carregando || g.fim) return;
  g.carregando = true; desenharAtividade();
  try {
    const antes = g.itens.length ? g.itens[g.itens.length - 1].criado_em : null;
    const lote = await KB_FONTE.atividadeBoard(antes, 60);
    g.itens = g.itens.concat(lote);
    g.fim = lote.length < 60;
  } catch (e) { toast(e.message, true); g.fim = true; }
  g.carregando = false;
  desenharAtividade();
}
function desenharAtividade() {
  const g = gaveta;
  if (!g || g.tipo !== 'atv') return;
  const corpo = g.itens.map(x => `<div class="evento ativ">${avatarNome(x.autor_nome, false, x.autor_email)}<div class="corpo">
      <div class="quem"><b>${esc(x.autor_nome || '?')}</b> ${KB.frase(x, true)}</div>
      <div class="quando">${esc(KB.dataHora(x.criado_em))}${x.card_id ? ` · <button class="lnk" data-abrir="${esc(x.card_id)}" type="button">abrir card</button>` : ''}</div></div></div>`).join('')
    + (g.carregando ? '<div class="sync">Carregando…</div>'
      : g.fim ? '' : '<button class="btn btn-mini" id="btMaisAtv" type="button" style="margin-top:8px">Carregar mais</button>');
  const rol = $('.gaveta-corpo') ? $('.gaveta-corpo').scrollTop : 0;
  desenharGaveta('Atividade', corpo || '<div class="sync">Carregando…</div>');
  $('.gaveta-corpo').scrollTop = rol;
}

/* ============================================================
   CARGA E TEMPO REAL
   ============================================================ */
async function recarregar() {
  try {
    const b = await KB_FONTE.carregarBoard();
    Object.assign(S, b);
    S.carregou = true; S.erro = null;
    indexar();
    renderBoard();
    if (gaveta && gaveta.tipo === 'arq') atualizarArquivados();
    const s = $('#sync'); if (s) { s.textContent = ''; s.classList.remove('erro'); }
  } catch (e) {
    if (!S.carregou) { S.erro = e.message; renderBoard(); }
    else { const s = $('#sync'); if (s) { s.textContent = 'sem conexão — ' + e.message; s.classList.add('erro'); } }
  }
}

/* Mudança de outra pessoa: espera a rajada passar e recarrega. Se houver edição aberta
   no card, não pisa no que está sendo digitado — recarrega quando a edição terminar. */
let tMudanca = null;
function aoMudar() {
  clearTimeout(tMudanca);
  tMudanca = setTimeout(async () => {
    if (arrastado || arrastadoLista || arrastadoItem) return aoMudar();
    await recarregar();
    if (S.aberto) { if (emEdicao()) pendente = true; else await recarregarCard(); }
  }, 400);
}

async function iniciar() {
  renderBarra();
  try {
    const s = await KB_FONTE.sessao();
    S.eu.email = (s && s.email) || (window.HUB && window.HUB.email) || null;
    try { S.eu.membroId = await KB_FONTE.entrar(); }
    catch (e) {
      if (/sem acesso/i.test(e.message)) { S.erro = 'Sem acesso ao Kanban.'; renderBoard(); return; }
      console.warn('[kanban] entrar:', e.message);
    }
    renderBarra();
    await recarregar();
    if (!S.listas.length && !S.erro) {
      $('#board').innerHTML = `<div class="empty"><div><div class="big">▦</div><div>O board ainda não tem listas.</div></div></div>
        <div class="nova-lista"><input id="inNovaLista" placeholder="+ Adicionar lista" aria-label="Nome da nova lista"></div>`;
    }
    KB_FONTE.assinar(aoMudar);
    // link direto (Copiar link, aviso do Slack): o hub passa o card no endereço do iframe
    const alvo = /(?:^|[#&])card=([0-9a-z-]{4,40})/i.exec(location.hash);
    if (alvo) abrirCard(alvo[1]);
  } catch (e) {
    S.erro = e.message; renderBoard();
  }
}

// para o teste
window.KB_TELA = { estado: () => S, recarregar, abrirCard, moverCard };
iniciar();
</script>
