<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanban Planejamento, Controle e Concierge · Luxor P&amp;C</title>
<link rel="stylesheet" href="../fonts.css">
<style>
/* ============================================================
   Mesmos tokens do Saldo Bancário e do Controle de Pagamentos,
   declarados aqui para o painel abrir sozinho por file://.
   ============================================================ */
:root{
  --bg:#0D2126; --bg-2:#113036;
  --surface:#143840; --surface-2:#1B4650; --surface-3:#22525D;
  --ink:#EAF4F4; --ink-2:#A7C3C5; --ink-3:#6E8C90;
  --orange:#FFA400; --orange-deep:#E08E00; --orange-soft:rgba(255,164,0,.14);
  --teal:#1D6E79; --teal-light:#2E97A6;
  --pos:#46B678; --neg:#E5674E; --warn:#F2C14E;
  --pos-soft:rgba(70,182,120,.16); --neg-soft:rgba(229,103,78,.16); --warn-soft:rgba(242,193,78,.16);
  --line:rgba(255,255,255,.13); --line-strong:rgba(255,255,255,.24);
  --r:14px; --r-sm:9px; --ctl-h:34px;
  --gutter:20px; --col-w:276px;
  --shadow-card:0 1px 3px rgba(0,0,0,.35);
  --font-sans:"Fakt Pro",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --font-serif:"Fakt Slab Pro","Fakt Pro",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
button{font:inherit}
input,textarea,select{font:inherit;color:var(--ink)}
a{color:var(--teal-light)}

/* ---- barra de cima ---- */
.topbar{border-bottom:1px solid var(--line);background:var(--bg-2);flex:0 0 auto;z-index:6}
.topbar-inner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px var(--gutter)}
.topbar .spacer{flex:1}
.busca{height:var(--ctl-h);width:240px;max-width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:0 12px;outline:none}
.busca:focus{border-color:var(--orange)}
.btn{background:transparent;border:1px solid var(--line);color:var(--ink-2);height:var(--ctl-h);
  padding:0 12px;border-radius:var(--r-sm);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  white-space:nowrap}
.btn:hover{border-color:var(--orange);color:var(--orange)}
.btn.on{background:var(--orange-soft);border-color:rgba(255,164,0,.55);color:var(--orange)}
.btn:disabled{opacity:.5;cursor:default}
.btn-acao{background:var(--orange);border:1px solid var(--orange);color:#201700;height:var(--ctl-h);
  padding:0 14px;border-radius:var(--r-sm);font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn-acao:hover{background:var(--orange-deep);border-color:var(--orange-deep)}
.btn-acao:disabled{opacity:.5;cursor:default}
.btn-perigo{background:transparent;border:1px solid rgba(229,103,78,.55);color:var(--neg);height:var(--ctl-h);
  padding:0 12px;border-radius:var(--r-sm);font-size:13px;cursor:pointer}
.btn-perigo:hover{background:var(--neg-soft)}
.btn-mini{height:28px;padding:0 10px;font-size:12px}
.sync{color:var(--ink-3);font-size:12px;white-space:nowrap}
.sync.erro{color:var(--neg)}

/* ---- board ---- */
.board{flex:1;display:flex;align-items:flex-start;gap:12px;overflow-x:auto;overflow-y:hidden;
  padding:16px var(--gutter) 12px}
.kcol{flex:0 0 var(--col-w);max-height:100%;display:flex;flex-direction:column;background:var(--bg-2);
  border:1px solid var(--line);border-radius:var(--r)}
.kcol-head{display:flex;align-items:center;gap:8px;padding:10px 10px 6px 14px}
.kcol-head[draggable="true"]{cursor:grab}
.kcol.arrastando{opacity:.35}
.ph-lista{flex:0 0 var(--col-w);border:2px dashed var(--orange);border-radius:var(--r);background:var(--orange-soft)}
.kcol-topo{padding:2px 8px 6px}
/* lista recolhida: faixa estreita, nome na vertical */
.kcol.recolhida{flex:0 0 44px;align-items:center;padding:8px 0;gap:8px;cursor:pointer}
.kcol.recolhida .vertical{writing-mode:vertical-rl;font-family:var(--font-serif);font-weight:600;font-size:13.5px;
  white-space:nowrap;display:flex;gap:8px;align-items:center}
.kcol.recolhida .vertical .n{color:var(--ink-3);font-size:12px}
.kcol-head h2{font-family:var(--font-serif);font-size:14px;font-weight:600;margin:0;flex:1;
  overflow-wrap:anywhere;cursor:text}
.kcol-head .n{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.kcol-head input{flex:1;height:30px;background:var(--surface);border:1px solid var(--orange);border-radius:7px;
  padding:0 8px;outline:none;font-weight:600}
.ico-btn{background:transparent;border:0;color:var(--ink-3);width:28px;height:28px;border-radius:7px;cursor:pointer;
  display:inline-grid;place-items:center;flex:0 0 auto}
.ico-btn:hover{background:var(--surface);color:var(--ink)}
.kcol-cards{flex:1;overflow-y:auto;padding:4px 8px;min-height:12px;display:flex;flex-direction:column;gap:8px}
.kcol-foot{padding:6px 8px 10px}
.add-card{width:100%;text-align:left;background:transparent;border:0;color:var(--ink-3);padding:7px 8px;
  border-radius:8px;cursor:pointer;font-size:13px}
.add-card:hover{background:var(--surface);color:var(--ink)}
.composer textarea{width:100%;min-height:62px;resize:vertical;background:var(--surface);border:1px solid var(--orange);
  border-radius:9px;padding:8px 10px;outline:none}
.composer .row{display:flex;gap:8px;margin-top:6px;align-items:center}
.nova-lista{flex:0 0 var(--col-w);background:rgba(255,255,255,.04);border:1px dashed var(--line-strong);
  border-radius:var(--r);padding:10px}
.nova-lista input{width:100%;height:var(--ctl-h);background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:0 10px;outline:none}
.nova-lista input:focus{border-color:var(--orange)}

/* ---- card na coluna ---- */
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px 7px;
  box-shadow:var(--shadow-card);cursor:pointer;-webkit-user-select:none;user-select:none}
.kcard:hover{border-color:var(--line-strong);background:var(--surface-2)}
.kcard:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
.kcard.arrastando{opacity:.35}
.kcard .etqs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.kcard .ttl{font-size:13.5px;overflow-wrap:anywhere}
.kcard .badges{display:flex;flex-wrap:wrap;align-items:center;gap:4px 9px;margin-top:6px;color:var(--ink-3);font-size:11.5px}
.kcard .badges:empty{display:none}
.bdg{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.bdg.ok{color:#201700;background:var(--pos);padding:0 5px;border-radius:4px}
.bdg.modelo{color:var(--ink-2);border:1px solid var(--line-strong);padding:0 5px;border-radius:4px}
.prazo{display:inline-flex;align-items:center;gap:4px;padding:0 5px;border-radius:4px}
.prazo.vencido{background:var(--neg);color:#fff}
.prazo.proximo{background:var(--warn);color:#201700}
.prazo.concluido{background:var(--pos);color:#201700}
.mbrs{display:flex;gap:2px;margin-left:auto}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:600;
  color:#fff;flex:0 0 auto;letter-spacing:.02em;position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.g{width:30px;height:30px;font-size:11.5px}
.placeholder{border:2px dashed var(--orange);border-radius:10px;background:var(--orange-soft);flex:0 0 auto}

.etq{display:inline-flex;align-items:center;max-width:100%;height:18px;padding:0 7px;border-radius:4px;
  font-size:11px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.etq.vazia{width:40px;padding:0}
.etq.g{height:26px;font-size:12.5px;padding:0 10px}

/* ---- estados ---- */
.empty{display:grid;place-items:center;text-align:center;padding:60px 20px;color:var(--ink-3);flex:1}
.empty .big{font-size:36px;margin-bottom:8px;opacity:.5}
.erro-box{margin:8px 0;padding:10px 13px;border-radius:var(--r-sm);font-size:12.5px;
  background:var(--neg-soft);border:1px solid rgba(229,103,78,.45);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:var(--surface-3);
  border:1px solid var(--line-strong);border-radius:10px;padding:9px 14px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.45);
  max-width:calc(100vw - 32px)}
.toast.erro{border-color:rgba(229,103,78,.7);background:#3a2422}
.toast .lnk{margin-left:12px;font-size:13px;color:var(--orange)}

/* ---- reações, formatação, visualizador ---- */
.reacoes{display:inline-flex;flex-wrap:wrap;gap:5px;align-items:center}
.reacao{height:24px;padding:0 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:12.5px;cursor:pointer;font-family:inherit}
.reacao:hover{border-color:var(--line-strong)}
.reacao.minha{border-color:var(--orange);background:var(--orange-soft)}
.reacao.mais-reacao{color:var(--ink-3);opacity:0;transition:opacity .12s}
.evento:hover .mais-reacao,.mais-reacao:focus{opacity:1}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.emojis button{height:38px;font-size:20px;border:0;border-radius:8px;background:transparent;cursor:pointer}
.emojis button:hover{background:var(--surface-2)}
.fmt{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:4px}
.fmt button{min-width:28px;height:26px;padding:0 6px;border:1px solid transparent;border-radius:6px;background:transparent;
  color:var(--ink-2);cursor:pointer;font-size:12.5px;display:inline-grid;place-items:center}
.fmt button:hover{background:var(--surface);border-color:var(--line);color:var(--ink)}
.novo-coment .fmt{opacity:.7}
.novo-coment:focus-within .fmt{opacity:1}
.banner-modelo{background:rgba(46,151,166,.16);border-bottom-color:rgba(46,151,166,.45)}
.kb-ver{cursor:zoom-in}
.item[draggable="true"]{cursor:grab}
.item.arrastando{opacity:.35}
.ph-item{border:2px dashed var(--orange);border-radius:7px;background:var(--orange-soft);margin:2px 0}
.visor{position:fixed;inset:0;z-index:80;background:rgba(3,10,12,.92);display:flex;flex-direction:column}
.visor-barra{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.visor-barra .nm{font-weight:600;overflow-wrap:anywhere}
.visor-barra .sub{color:var(--ink-3);font-size:12px}
.visor-corpo{flex:1;display:grid;place-items:center;padding:16px;overflow:auto}
.visor-corpo img{max-width:100%;max-height:calc(100vh - 110px);border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.visor-corpo iframe{width:min(1100px,100%);height:calc(100vh - 100px);border:0;border-radius:6px;background:#fff}
.sem-previa{text-align:center;color:var(--ink-2)}
.sem-previa .big{font-size:28px;font-weight:700;color:var(--ink);margin-bottom:6px}
.visor-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid var(--line-strong);
  background:rgba(20,56,64,.85);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.visor-nav.ant{left:14px}
.visor-nav.prox{right:14px}

/* ---- capa e sugestão de @ ---- */
.kcard .capa{margin:-8px -10px 7px;border-radius:10px 10px 0 0;overflow:hidden;max-height:150px;background:var(--surface-2)}
.kcard .capa img{display:block;width:100%;max-height:150px;object-fit:cover}
.kcard .capa .kb-capa{display:block;height:60px}
.mencoes{position:fixed;z-index:70;min-width:240px;max-width:320px;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:4px}
.mencoes .opt{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:13px}
.mencoes .opt.on,.mencoes .opt:hover{background:var(--surface-2)}
.mencoes .sub{color:var(--ink-3);font-size:11.5px}

/* ---- janela do card ---- */
.overlay{position:fixed;inset:0;background:rgba(3,12,14,.72);z-index:30;display:flex;justify-content:center;
  align-items:flex-start;overflow-y:auto;padding:40px 16px}
.dlg{position:relative;width:min(900px,100%);background:var(--bg-2);border:1px solid var(--line-strong);
  border-radius:var(--r);box-shadow:0 18px 60px rgba(0,0,0,.55);padding:20px 22px 24px}
.dlg .fechar{position:absolute;top:10px;right:10px}
.dlg-head{padding-right:34px}
.banner-arq{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-20px -22px 14px;padding:10px 22px;
  background:var(--warn-soft);border-bottom:1px solid rgba(242,193,78,.4);border-radius:var(--r) var(--r) 0 0;font-size:13px}
.titulo{width:100%;background:transparent;border:1px solid transparent;border-radius:8px;resize:none;overflow:hidden;
  font-family:var(--font-serif);font-size:19px;font-weight:600;padding:4px 6px;margin-left:-6px;outline:none;line-height:1.3}
.titulo:focus{background:var(--surface);border-color:var(--orange)}
.dlg-sub{color:var(--ink-3);font-size:12.5px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:2px}
.dlg-sub select{background:var(--surface);border:1px solid var(--line);border-radius:7px;height:28px;padding:0 8px;font-size:12.5px}
.dlg-body{display:grid;grid-template-columns:1fr 178px;gap:22px;margin-top:16px}
.dlg-side{display:flex;flex-direction:column;gap:6px}
.dlg-side h4{margin:8px 0 2px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.dlg-side .btn{justify-content:flex-start;width:100%}
.meta{display:flex;flex-wrap:wrap;gap:16px 26px;margin-bottom:6px}
.meta h4,.sec h3{margin:0 0 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.meta .linha{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.mais{width:30px;height:30px;border-radius:7px;border:1px dashed var(--line-strong);background:transparent;color:var(--ink-2);
  cursor:pointer;font-size:16px;line-height:1}
.mais:hover{border-color:var(--orange);color:var(--orange)}
.sec{margin-top:20px}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sec-head h3{margin:0;font-family:var(--font-serif);font-size:14.5px;letter-spacing:0;text-transform:none;color:var(--ink);flex:1;
  display:flex;align-items:center;gap:8px}
.md{font-size:13.5px;overflow-wrap:anywhere}
.md p{margin:0 0 8px}
.md p:last-child{margin-bottom:0}
.md h3,.md h4,.md h5,.md h6{font-family:var(--font-serif);margin:10px 0 6px;font-size:14px}
.md h3{font-size:15.5px}
.md ul,.md ol{margin:0 0 8px;padding-left:22px}
.md blockquote{margin:0 0 8px;padding:2px 0 2px 12px;border-left:3px solid var(--line-strong);color:var(--ink-2)}
.md code{background:var(--surface);padding:1px 5px;border-radius:4px;font-size:12.5px}
.md hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.md img{max-width:100%;max-height:360px;border-radius:8px;border:1px solid var(--line);display:block;margin:4px 0}
.kb-mencao{color:var(--orange);font-weight:600}
.kb-img{display:inline-block;color:var(--ink-3);font-size:12px;border:1px dashed var(--line);border-radius:6px;padding:2px 8px}
.desc-vazia{background:var(--surface);border-radius:9px;padding:12px;color:var(--ink-3);cursor:pointer;font-size:13px}
.desc-vazia:hover{background:var(--surface-2)}
.editor textarea{width:100%;min-height:140px;resize:vertical;background:var(--surface);border:1px solid var(--orange);
  border-radius:9px;padding:9px 11px;outline:none;line-height:1.5}
.editor .row{display:flex;gap:8px;margin-top:8px}
.ckl{margin-top:16px}
.ckl-head{display:flex;align-items:center;gap:8px}
.ckl-head .nome{flex:1;font-weight:600;cursor:text;overflow-wrap:anywhere}
.ckl-head input{flex:1;height:30px;background:var(--surface);border:1px solid var(--orange);border-radius:7px;padding:0 8px;outline:none}
.ckl-bar{display:flex;align-items:center;gap:8px;margin:6px 0 4px;font-size:11px;color:var(--ink-3)}
.ckl-bar .trilho{flex:1;height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.ckl-bar .trilho i{display:block;height:100%;background:var(--teal-light)}
.ckl-bar.cheio .trilho i{background:var(--pos)}
.item{display:flex;align-items:flex-start;gap:9px;padding:4px 6px;border-radius:7px}
.item:hover{background:var(--surface)}
.item input[type=checkbox]{margin-top:3px;width:15px;height:15px;accent-color:var(--orange);flex:0 0 auto}
.item .txt{flex:1;font-size:13.5px;overflow-wrap:anywhere;cursor:text}
.item.feito .txt{text-decoration:line-through;color:var(--ink-3)}
.item .acoes{display:flex;gap:2px;opacity:0}
.item:hover .acoes,.item:focus-within .acoes{opacity:1}
.item textarea,.add-item textarea{width:100%;min-height:36px;resize:vertical;background:var(--surface);border:1px solid var(--orange);
  border-radius:7px;padding:6px 8px;outline:none}
.add-item{margin:4px 0 0 30px}
.anexo{display:flex;gap:12px;align-items:center;padding:6px;border-radius:9px}
.anexo:hover{background:var(--surface)}
.anexo .thumb{width:84px;height:58px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;
  color:var(--ink-2);font-size:11px;font-weight:600;text-transform:uppercase;flex:0 0 auto;overflow:hidden;cursor:pointer}
.anexo .thumb img{width:100%;height:100%;object-fit:cover}
.anexo .info{flex:1;min-width:0}
.anexo .nome{font-weight:600;font-size:13px;overflow-wrap:anywhere;cursor:pointer}
.anexo .nome:hover{color:var(--orange)}
.anexo .sub{color:var(--ink-3);font-size:11.5px}
.anexo .acoes{display:flex;gap:10px;font-size:12px;margin-top:2px}
.lnk{background:transparent;border:0;padding:0;color:var(--ink-2);cursor:pointer;text-decoration:underline;font-size:12px}
.lnk:hover{color:var(--orange)}
.lnk.perigo:hover{color:var(--neg)}
.novo-coment{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.novo-coment .caixa{flex:1}
/* altura fixa de propósito: crescer no foco e encolher no blur movia o "Salvar"
   para cima no meio do clique, e o clique caía fora do botão */
.novo-coment textarea{width:100%;min-height:64px;resize:vertical;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;outline:none}
.novo-coment textarea:focus{border-color:var(--orange)}
.evento{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.evento .corpo{flex:1;min-width:0}
.evento .quem{font-size:13px}
.evento .quem b{font-weight:600}
.evento .quando{color:var(--ink-3);font-size:11.5px}
.evento .bolha{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin-top:4px}
.evento.ativ .quem{color:var(--ink-2)}
.evento .acoes{display:flex;gap:10px;margin-top:3px}

/* ---- popover ---- */
.pop{position:fixed;z-index:50;width:304px;max-width:calc(100vw - 16px);background:var(--surface);border:1px solid var(--line-strong);
  border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.55);padding:12px}
.pop h5{margin:0 0 10px;text-align:center;font-size:13px;color:var(--ink-2);font-weight:600}
.pop .fechar-pop{position:absolute;top:6px;right:6px}
.pop label.lbl{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:10px 0 4px}
.pop input[type=text],.pop input[type=url],.pop input[type=datetime-local],.pop select,.pop textarea{width:100%;
  background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;outline:none;min-height:var(--ctl-h)}
.pop input:focus,.pop select:focus,.pop textarea:focus{border-color:var(--orange)}
.pop .rows{display:flex;flex-direction:column;gap:3px;max-height:320px;overflow-y:auto}
.pop .opt{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:8px;cursor:pointer}
.pop .opt:hover{background:var(--surface-2)}
.pop .opt .nm{flex:1;overflow-wrap:anywhere;font-size:13px}
.pop .opt .sub{color:var(--ink-3);font-size:11px}
.pop .ok{color:var(--orange);font-weight:700}
.pop .fim{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.pop .chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.pop .chk input{accent-color:var(--orange);width:15px;height:15px}
.cores{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cores button{height:30px;border-radius:6px;border:2px solid transparent;cursor:pointer}
.cores button.on{border-color:#fff}

/* ---- gaveta (arquivados, atividade) ---- */
.gaveta{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);z-index:40;background:var(--bg-2);
  border-left:1px solid var(--line-strong);box-shadow:-12px 0 40px rgba(0,0,0,.45);display:flex;flex-direction:column}
.gaveta-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.gaveta-head h3{margin:0;flex:1;font-family:var(--font-serif);font-size:15px}
.gaveta-corpo{flex:1;overflow-y:auto;padding:12px 16px 24px}
.gaveta .abas{display:flex;gap:6px;margin-bottom:10px}
.arq{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);margin-bottom:8px}
.arq .info{flex:1;min-width:0}
.arq .nome{font-size:13px;overflow-wrap:anywhere;cursor:pointer}
.arq .nome:hover{color:var(--orange)}
.arq .sub{color:var(--ink-3);font-size:11.5px;margin-top:2px}
.arq .acoes{display:flex;flex-direction:column;gap:5px}

@media (max-width:760px){
  :root{--gutter:12px;--col-w:84vw}
  .dlg-body{grid-template-columns:1fr}
  .dlg-side{order:-1;flex-direction:row;flex-wrap:wrap}
  .dlg-side h4{width:100%}
  .dlg-side .btn{width:auto}
  .overlay{padding:0}
  .dlg{border-radius:0;min-height:100%}
  .busca{width:100%}
}
</style>
</head>
<body>

<header class="topbar"><div class="topbar-inner" id="barra"></div></header>
<main class="board" id="board"><div class="empty"><div>Carregando o board…</div></div></main>
<div id="modal"></div>
<div id="gaveta"></div>
<div id="pop"></div>
<div id="mencoes"></div>
<div id="visor"></div>
<div id="toast"></div>

<script src="../vendor/supabase.min.js"></script>
<script src="config.js"></script>
<script src="kb_dados.js"></script>
<script src="kb_fonte.js"></script>
<script>
'use strict';
const KB = KB_DADOS;
const esc = KB.esc;
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));

/* ---------- ícones (traço, 24x24) ---------- */
const ICO = {
  x: 'M18 6L6 18M6 6l12 12',
  mais: 'M12 5v14M5 12h14',
  menu: 'M5 12h.01M12 12h.01M19 12h.01',
  desc: 'M4 6h16M4 12h16M4 18h10',
  coment: 'M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z',
  clipe: 'M21 11.5l-8.6 8.6a5 5 0 01-7.1-7.1l8.6-8.6a3.4 3.4 0 014.8 4.8l-8.6 8.6a1.7 1.7 0 01-2.4-2.4l7.9-7.9',
  check: 'M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11',
  relogio: 'M12 7v5l3 2M12 21a9 9 0 100-18 9 9 0 000 18z',
  etiqueta: 'M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0L3 13V3h10l7.6 7.6a2 2 0 010 2.8zM7.5 7.5h.01',
  pessoa: 'M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z',
  mover: 'M5 12h14M13 6l6 6-6 6',
  copiar: 'M8 8h12v12H8zM4 16V4h12',
  arquivo: 'M3 7h18M5 7v13h14V7M9 11h6M4 3h16v4H4z',
  restaurar: 'M3 12a9 9 0 109-9 9.7 9.7 0 00-6.7 2.7L3 8M3 3v5h5',
  lixo: 'M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14',
  lapis: 'M11 4h2M4 20h16M7 17l9.5-9.5a2.1 2.1 0 00-3-3L4 14v3h3z',
  atividade: 'M22 12h-4l-3 9L9 3l-3 9H2',
  filtro: 'M3 5h18l-7 8v6l-4 2v-8z',
  esq: 'M15 18l-6-6 6-6', dir: 'M9 18l6-6-6-6',
  link: 'M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1',
  olho: 'M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12zM12 15a3 3 0 100-6 3 3 0 000 6z',
  cheia: 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5',
  sair: 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5',
  imagem: 'M4 5h16v14H4zM4 15l4-4 4 4 3-3 5 5M15 9h.01'
};
const svg = (k, s) => `<svg width="${s||14}" height="${s||14}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICO[k]}"/></svg>`;

/* ---------- estado ---------- */
const S = {
  listas: [], etiquetas: [], membros: [], cards: [],
  eu: { email: null, membroId: null },
  filtro: { texto: '', membros: [], etiquetas: [], semMembro: false, prazo: '' },
  aberto: null,          // { card, checklists, comentarios, anexos, atividade }
  detalhes: false,       // mostrar histórico junto dos comentários
  erro: null, carregou: false,
  buscaIds: null,        // cards que a busca do banco achou em comentário/checklist
  ocultarFeitos: {},     // checklist -> esconder itens marcados
};
const IX = { lista: new Map(), etq: new Map(), mbr: new Map(), usuarios: {} };

function indexar() {
  IX.lista = new Map(S.listas.map(l => [l.id, l]));
  IX.etq = new Map(S.etiquetas.map(e => [e.id, e]));
  IX.mbr = new Map(S.membros.map(m => [m.id, m]));
  IX.usuarios = {};
  S.membros.forEach(m => { if (m.usuario) IX.usuarios[m.usuario.toLowerCase()] = m.nome; });
}
const listasAbertas = () => S.listas.filter(l => !l.arquivada).sort((a, b) => a.pos - b.pos);
const cardsDaLista = id => S.cards.filter(c => c.lista_id === id && !c.arquivado).sort(KB.porPos);
const md = t => KB.markdown(t, { usuarios: IX.usuarios });

/* filtro guardado por pessoa, neste navegador */
const CHAVE_FILTRO = 'kanban.filtro';
try {
  const f = JSON.parse(localStorage.getItem(CHAVE_FILTRO) || 'null');
  if (f && typeof f === 'object') Object.assign(S.filtro, f);
  S.detalhes = localStorage.getItem('kanban.detalhes') === '1';
} catch (e) { /* sem storage: segue com o padrão */ }
function guardarFiltro() {
  try { localStorage.setItem(CHAVE_FILTRO, JSON.stringify(S.filtro)); } catch (e) {}
}

/* ---------- avatar e etiqueta ---------- */
const CORES_AV = ['#1D6E79', '#346E79', '#B86E00', '#2E97A6', '#5B4E8C', '#8A4B5E', '#3F6E3A', '#7A5C1E'];
function corAvatar(nome) {
  let h = 0; for (const ch of String(nome || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return CORES_AV[h % CORES_AV.length];
}
/* Avatar: foto do Slack por cima das iniciais. Se a imagem não carregar, ela se
   remove e as iniciais (que já estão embaixo) aparecem. */
function fotoDe(email) {
  const u = email && S.fotos && S.fotos[String(email).toLowerCase()];
  return u && /^https:\/\//.test(u) ? u : null;
}
function avatarNome(nome, grande, email) {
  const f = fotoDe(email);
  return `<span class="av${grande ? ' g' : ''}" style="background:${corAvatar(nome)}" title="${esc(nome || '')}">${esc(KB.iniciais(nome))}${
    f ? `<img src="${esc(f)}" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()">` : ''}</span>`;
}
function avatar(m, grande) {
  return m ? avatarNome(m.nome, grande, m.email) : '';
}
function chipEtq(e, grande) {
  if (!e) return '';
  return `<span class="etq${grande ? ' g' : ''}${e.nome ? '' : ' vazia'}" style="background:${KB.corEtiqueta(e.cor)};color:${KB.textoEtiqueta(e.cor)}"
    title="${esc(e.nome || 'sem nome')}">${esc(e.nome)}</span>`;
}
// datas do card: "12 nov", ou "3 – 12 nov" com início; a cor é a do prazo
function chipPrazo(c, longo) {
  if (!c.prazo && !c.inicio) return '';
  const st = KB.prazoEstado(c.prazo, c.prazo_concluido) || '';
  const quando = longo
    ? [c.inicio ? 'início ' + KB.dataHora(c.inicio) : '', c.prazo ? KB.dataHora(c.prazo) : ''].filter(Boolean).join(' → ')
    : KB.rotuloDatas(c.inicio, c.prazo);
  const titulo = [c.inicio ? 'Início ' + KB.dataHora(c.inicio) : '', c.prazo ? 'Prazo ' + KB.dataHora(c.prazo) : ''].filter(Boolean).join(' · ');
  return `<span class="prazo ${st}" title="${esc(titulo)}">${svg('relogio', 12)} ${esc(quando)}</span>`;
}
const ROT_PRAZO = { sem: 'Sem prazo', vencido: 'Vencidos', dia: 'Vence em 24h', semana: 'Vence em 7 dias',
                    mes: 'Vence em 30 dias', concluido: 'Prazo concluído', aberto: 'Prazo em aberto' };
const ROT_ATIV = { '1s': 'Ativos na semana', '2s': 'Ativos em 2 semanas', '4s': 'Ativos em 4 semanas',
                   parado: 'Parados há 4 semanas' };

/* ---------- avisos ---------- */
let tToast = null;
// `acao` = { rotulo, fn }: botão no próprio aviso (o "Desfazer" do arquivar)
function toast(msg, erro, acao) {
  const el = $('#toast');
  el.innerHTML = `<div class="toast${erro ? ' erro' : ''}" role="status">${esc(msg)}${
    acao ? `<button class="lnk" id="btToast" type="button">${esc(acao.rotulo)}</button>` : ''}</div>`;
  if (acao) $('#btToast').onclick = () => { el.innerHTML = ''; acao.fn(); };
  clearTimeout(tToast);
  tToast = setTimeout(() => { el.innerHTML = ''; }, erro ? 7000 : acao ? 8000 : 2600);
}

/* Link de um card: abre o hub já no card. O iframe é do mesmo endereço do hub. */
const linkDoCard = id => location.origin + '/#/kanban?card=' + id;
async function copiarLink(id) {
  const url = linkDoCard(id);
  try { await navigator.clipboard.writeText(url); toast('Link do card copiado.'); }
  catch (e) { prompt('Copie o link do card:', url); }
}
const eSigo = c => !!S.eu.membroId && (c.seguidores || []).includes(S.eu.membroId);

/* Arquivar dá para desfazer pelo próprio aviso: o time arquivava sem querer no Trello. */
async function arquivarCard(id) {
  await tentar(() => KB_FONTE.atualizarCard(id, { arquivado: true }));
  if (S.aberto && S.aberto.card.id === id) await recarregarCard();
  toast('Card arquivado.', false, { rotulo: 'Desfazer', fn: async () => {
    await tentar(() => KB_FONTE.atualizarCard(id, { arquivado: false }));
    if (S.aberto && S.aberto.card.id === id) await recarregarCard();
  } });
}
async function tentar(fn, depois) {
  try { const r = await fn(); if (depois !== false) await recarregar(); return r; }
  catch (e) { console.error(e); toast(e.message || String(e), true); await recarregar(); return undefined; }
}

/* ============================================================
   BARRA
   ============================================================ */
function renderBarra() {
  const f = S.filtro, ativo = KB.filtroAtivo(f);
  const nMbr = (f.membros || []).length + (f.semMembro ? 1 : 0);
  const nEtq = (f.etiquetas || []).length + (f.semEtiqueta ? 1 : 0);
  const datas = [ROT_PRAZO[f.prazo], ROT_ATIV[f.atividade]].filter(Boolean).join(' · ');
  const meu = S.eu.membroId && f.membros.length === 1 && f.membros[0] === S.eu.membroId && !f.semMembro;
  $('#barra').innerHTML = `
    <input class="busca" id="fTexto" type="search" placeholder="Buscar cards" value="${esc(f.texto)}" aria-label="Buscar cards">
    ${S.eu.membroId ? `<button class="btn${meu ? ' on' : ''}" id="fMeus" type="button">${svg('pessoa', 13)} Meus cards</button>` : ''}
    <button class="btn${nMbr ? ' on' : ''}" id="fMembros" type="button">${svg('pessoa', 13)} Membros${nMbr ? ' · ' + nMbr : ''}</button>
    <button class="btn${nEtq ? ' on' : ''}" id="fEtiquetas" type="button">${svg('etiqueta', 13)} Etiquetas${nEtq ? ' · ' + nEtq : ''}</button>
    <button class="btn${datas ? ' on' : ''}" id="fPrazo" type="button">${svg('relogio', 13)} ${esc(datas || 'Datas e atividade')}</button>
    ${ativo ? `<button class="btn" id="fLimpar" type="button">${svg('x', 12)} Limpar filtros</button>` : ''}
    <span class="spacer"></span>
    <span class="sync" id="sync"></span>
    <button class="btn" id="btAtividade" type="button">${svg('atividade', 13)} Atividade</button>
    <button class="btn" id="btArquivados" type="button">${svg('arquivo', 13)} Arquivados</button>
    ${document.fullscreenEnabled ? `<button class="btn" id="btTelaCheia" type="button" title="${document.fullscreenElement ? 'Sair da tela cheia (Esc)' : 'Tela cheia'}">
      ${svg(document.fullscreenElement ? 'sair' : 'cheia', 13)} ${document.fullscreenElement ? 'Sair da tela cheia' : 'Tela cheia'}</button>` : ''}`;
}
/* Tela cheia: só o board, sem o menu do hub — boa para a reunião de segunda no telão.
   O iframe do hub precisa do allow="fullscreen" (ver renderKanban em assets/app.js);
   sem ele o navegador nega e o botão nem aparece (fullscreenEnabled = false). */
document.addEventListener('fullscreenchange', () => {
  const foco = document.activeElement && document.activeElement.id === 'fTexto';
  renderBarra();
  if (foco) $('#fTexto').focus();
});

/* Um card passa no filtro pelo título/descrição (na hora, aqui) ou porque a busca do
   banco o achou num comentário ou item de checklist (chega logo depois). */
function passaFiltro(c) {
  if (KB.passa(c, S.filtro)) return true;
  return !!(S.filtro.texto && S.buscaIds && S.buscaIds.has(c.id)
            && KB.passa(c, Object.assign({}, S.filtro, { texto: '' })));
}
let tBusca = null;
function buscarNoBanco() {
  clearTimeout(tBusca);
  const q = (S.filtro.texto || '').trim();
  if (q.length < 3) { S.buscaIds = null; return; }
  tBusca = setTimeout(async () => {
    try {
      const r = await KB_FONTE.buscar(q, 300);
      if ((S.filtro.texto || '').trim() !== q) return;      // já digitaram outra coisa
      S.buscaIds = new Set(r.filter(x => !x.arquivado).map(x => x.card_id));
      renderBoard();
    } catch (e) { console.warn('[kanban] busca:', e.message); }
  }, 350);
}

$('#barra').addEventListener('input', ev => {
  if (ev.target.id !== 'fTexto') return;
  S.filtro.texto = ev.target.value;
  guardarFiltro();
  buscarNoBanco();
  renderBoard();
  // a barra não é redesenhada a cada tecla (perderia o foco); só o "Limpar filtros"
  const tem = !!$('#fLimpar');
  if (tem !== KB.filtroAtivo(S.filtro)) { const pos = ev.target.selectionStart; renderBarra(); const i = $('#fTexto'); i.focus(); i.setSelectionRange(pos, pos); }
});
$('#barra').addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.id === 'fMeus') {
    const meu = S.filtro.membros.length === 1 && S.filtro.membros[0] === S.eu.membroId && !S.filtro.semMembro;
    S.filtro.membros = meu ? [] : [S.eu.membroId]; S.filtro.semMembro = false;
    guardarFiltro(); renderBarra(); renderBoard();
  } else if (b.id === 'fMembros') popFiltroMembros(b);
  else if (b.id === 'fEtiquetas') popFiltroEtiquetas(b);
  else if (b.id === 'fPrazo') popFiltroPrazo(b);
  else if (b.id === 'fLimpar') {
    S.filtro = { texto: '', membros: [], etiquetas: [], semMembro: false, semEtiqueta: false,
                 etiquetasTodas: false, prazo: '', atividade: '' };
    S.buscaIds = null;
    guardarFiltro(); renderBarra(); renderBoard();
  } else if (b.id === 'btArquivados') abrirArquivados();
  else if (b.id === 'btAtividade') abrirAtividade();
  else if (b.id === 'btTelaCheia') {
    const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    p.catch(e => toast('O navegador não deixou entrar em tela cheia: ' + e.message, true));
  }
});

function popFiltroMembros(anc) {
  const f = S.filtro;
  abrirPop(anc, 'Filtrar por membro', () => `
    <div class="rows">
      <div class="opt" data-sem="1"><span class="av" style="background:var(--surface-3)">–</span><span class="nm">Sem membro</span>${f.semMembro ? '<span class="ok">✓</span>' : ''}</div>
      ${S.membros.map(m => `<div class="opt" data-id="${esc(m.id)}">${avatar(m)}<span class="nm">${esc(m.nome)}${m.email ? '' : ' <span class="sub">· sem login</span>'}</span>${f.membros.includes(m.id) ? '<span class="ok">✓</span>' : ''}</div>`).join('')}
    </div>`, (el, redesenhar) => {
    el.addEventListener('click', ev => {
      const o = ev.target.closest('.opt'); if (!o) return;
      if (o.dataset.sem) f.semMembro = !f.semMembro;
      else f.membros = f.membros.includes(o.dataset.id) ? f.membros.filter(x => x !== o.dataset.id) : f.membros.concat(o.dataset.id);
      guardarFiltro(); renderBarra(); renderBoard(); redesenhar();
    });
  });
}
function popFiltroEtiquetas(anc) {
  const f = S.filtro;
  abrirPop(anc, 'Filtrar por etiqueta', () => `
    <div class="rows">
      <div class="opt" data-sem="1"><span class="etq vazia" style="background:var(--surface-3)"></span><span class="nm">Sem etiqueta</span>${f.semEtiqueta ? '<span class="ok">✓</span>' : ''}</div>
      ${S.etiquetas.map(e => `<div class="opt" data-id="${esc(e.id)}">${chipEtq(e)}<span class="nm"></span>${f.etiquetas.includes(e.id) ? '<span class="ok">✓</span>' : ''}</div>`).join('')}
    </div>
    <label class="lbl">Com mais de uma marcada</label>
    <div class="rows"><div class="opt" data-todas="0"><span class="nm">Qualquer uma delas</span>${!f.etiquetasTodas ? '<span class="ok">✓</span>' : ''}</div>
      <div class="opt" data-todas="1"><span class="nm">Todas elas</span>${f.etiquetasTodas ? '<span class="ok">✓</span>' : ''}</div></div>`,
    (el, redesenhar) => {
    el.addEventListener('click', ev => {
      const o = ev.target.closest('.opt'); if (!o) return;
      if (o.dataset.sem) f.semEtiqueta = !f.semEtiqueta;
      else if (o.dataset.todas) f.etiquetasTodas = o.dataset.todas === '1';
      else f.etiquetas = f.etiquetas.includes(o.dataset.id) ? f.etiquetas.filter(x => x !== o.dataset.id) : f.etiquetas.concat(o.dataset.id);
      guardarFiltro(); renderBarra(); renderBoard(); redesenhar();
    });
  });
}
function popFiltroPrazo(anc) {
  const f = S.filtro;
  const prazos = [['', 'Qualquer'], ['sem', 'Sem prazo'], ['vencido', 'Vencidos'], ['dia', 'Vence em até 24h'],
                  ['semana', 'Vence em até 7 dias'], ['mes', 'Vence em até 30 dias'],
                  ['aberto', 'Com prazo em aberto'], ['concluido', 'Com prazo concluído']];
  const ativs = [['', 'Qualquer'], ['1s', 'Mexidos na última semana'], ['2s', 'Mexidos nas últimas 2 semanas'],
                 ['4s', 'Mexidos nas últimas 4 semanas'], ['parado', 'Parados há mais de 4 semanas']];
  abrirPop(anc, 'Datas e atividade', () => `
    <label class="lbl">Prazo</label><div class="rows">${prazos.map(([v, t]) =>
      `<div class="opt" data-p="${v}"><span class="nm">${t}</span>${(f.prazo || '') === v ? '<span class="ok">✓</span>' : ''}</div>`).join('')}</div>
    <label class="lbl">Atividade</label><div class="rows">${ativs.map(([v, t]) =>
      `<div class="opt" data-a="${v}"><span class="nm">${t}</span>${(f.atividade || '') === v ? '<span class="ok">✓</span>' : ''}</div>`).join('')}</div>`,
    (el, redesenhar) => el.addEventListener('click', ev => {
      const o = ev.target.closest('.opt'); if (!o) return;
      if (o.dataset.p !== undefined) f.prazo = o.dataset.p; else f.atividade = o.dataset.a;
      guardarFiltro(); renderBarra(); renderBoard(); redesenhar();
    }));
}

/* ============================================================
   BOARD
   ============================================================ */
let compondo = null;      // lista com o "adicionar card" aberto
let renomeandoLista = null;

function faceCard(c) {
  const etqs = c.etiquetas.map(id => IX.etq.get(id)).filter(Boolean);
  const mbrs = c.membros.map(id => IX.mbr.get(id)).filter(Boolean);
  const it = c.itens || { feitos: 0, total: 0 };
  const bad = [
    c.modelo ? '<span class="bdg modelo">Modelo</span>' : '',
    chipPrazo(c),
    c.descricao ? `<span class="bdg" title="Tem descrição">${svg('desc', 12)}</span>` : '',
    c.comentarios ? `<span class="bdg" title="Comentários">${svg('coment', 12)} ${c.comentarios}</span>` : '',
    c.anexos ? `<span class="bdg" title="Anexos">${svg('clipe', 12)} ${c.anexos}</span>` : '',
    it.total ? `<span class="bdg${it.feitos === it.total ? ' ok' : ''}" title="Checklist">${svg('check', 12)} ${it.feitos}/${it.total}</span>` : '',
    eSigo(c) ? `<span class="bdg" title="Você segue este card">${svg('olho', 12)}</span>` : '',
    mbrs.length ? `<span class="mbrs">${mbrs.map(m => avatar(m)).join('')}</span>` : ''
  ].join('');
  return `<div class="kcard" draggable="true" tabindex="0" data-id="${esc(c.id)}">
    ${c.capa ? `<div class="capa"><span class="kb-capa" data-anexo="${esc(c.capa)}"></span></div>` : ''}
    ${etqs.length ? `<div class="etqs">${etqs.map(e => chipEtq(e)).join('')}</div>` : ''}
    <div class="ttl">${esc(c.nome)}</div>
    <div class="badges">${bad}</div>
  </div>`;
}

/* Listas recolhidas ("Recolher lista" do Trello): por pessoa, neste navegador. */
let RECOLHIDAS = new Set();
try { RECOLHIDAS = new Set(JSON.parse(localStorage.getItem('kanban.recolhidas') || '[]')); } catch (e) {}
function alternarRecolhida(id) {
  if (RECOLHIDAS.has(id)) RECOLHIDAS.delete(id); else RECOLHIDAS.add(id);
  try { localStorage.setItem('kanban.recolhidas', JSON.stringify([...RECOLHIDAS])); } catch (e) {}
  renderBoard();
}

function composer(l) {
  const temModelo = S.cards.some(c => c.modelo);
  return `<div class="composer">
      <textarea id="inCard" placeholder="Título do card" aria-label="Título do novo card"></textarea>
      <div class="row"><button class="btn-acao btn-mini" data-acao="salvar-card" type="button">Adicionar card</button>
        <button class="ico-btn" data-acao="cancelar-card" type="button" aria-label="Cancelar">${svg('x', 16)}</button>
        ${temModelo ? `<span style="flex:1"></span><button class="btn btn-mini" data-acao="usar-modelo" type="button" title="Criar a partir de um card modelo">${svg('copiar', 12)} Modelo</button>` : ''}</div>
    </div>`;
}

function coluna(l) {
  const todos = cardsDaLista(l.id);
  const vis = todos.filter(passaFiltro);
  const filtrando = KB.filtroAtivo(S.filtro);
  const n = `${filtrando ? vis.length + '/' : ''}${todos.length}`;
  if (RECOLHIDAS.has(l.id)) {
    return `<section class="kcol recolhida" data-lista="${esc(l.id)}" aria-label="${esc(l.nome)} (recolhida)">
      <button class="ico-btn" data-acao="expandir" type="button" title="Expandir a lista" aria-label="Expandir ${esc(l.nome)}">${svg('dir', 14)}</button>
      <div class="vertical" data-acao="expandir">${esc(l.nome)} <span class="n">${n}</span></div>
    </section>`;
  }
  const noTopo = compondo && compondo.lista === l.id && compondo.topo;
  return `<section class="kcol" data-lista="${esc(l.id)}" aria-label="${esc(l.nome)}">
    <div class="kcol-head"${renomeandoLista === l.id ? '' : ' draggable="true" title="Arraste para mudar a lista de lugar"'}>
      ${renomeandoLista === l.id
        ? `<input id="inLista" value="${esc(l.nome)}" aria-label="Nome da lista">`
        : `<h2 data-acao="renomear-lista" title="Clique para renomear">${esc(l.nome)}</h2>`}
      <span class="n">${n}</span>
      <button class="ico-btn" data-acao="menu-lista" type="button" aria-label="Ações da lista">${svg('menu', 16)}</button>
    </div>
    ${noTopo ? `<div class="kcol-topo">${composer(l)}</div>` : ''}
    <div class="kcol-cards" data-lista="${esc(l.id)}">${vis.map(faceCard).join('')}</div>
    <div class="kcol-foot">${compondo && compondo.lista === l.id && !compondo.topo ? composer(l)
      : `<button class="add-card" data-acao="novo-card" type="button">+ Adicionar card</button>`}</div>
  </section>`;
}

function renderBoard() {
  const board = $('#board');
  if (S.erro) {
    board.innerHTML = `<div class="empty"><div><div class="big">!</div><div class="erro-box">${esc(S.erro)}</div>
      <button class="btn" id="btTentar" type="button">Tentar de novo</button></div></div>`;
    $('#btTentar').onclick = () => { S.erro = null; iniciar(); };
    return;
  }
  if (!S.carregou) return;
  // preserva rolagem (do board e de cada coluna) e o rascunho do card novo
  const rol = { x: board.scrollLeft, col: {} };
  $$('.kcol-cards', board).forEach(el => { rol.col[el.dataset.lista] = el.scrollTop; });
  const rascunho = $('#inCard') ? $('#inCard').value : '';
  const listas = listasAbertas();
  board.innerHTML = listas.map(coluna).join('') + `
    <div class="nova-lista"><input id="inNovaLista" placeholder="+ Adicionar outra lista" aria-label="Nome da nova lista"></div>`;
  board.scrollLeft = rol.x;
  $$('.kcol-cards', board).forEach(el => { if (rol.col[el.dataset.lista]) el.scrollTop = rol.col[el.dataset.lista]; });
  const ic = $('#inCard');
  if (ic) { ic.value = rascunho; ic.focus(); }
  const il = $('#inLista');
  if (il) { il.focus(); il.select(); }
  hidratar(board);                                     // capas
}

/* cliques no board (delegação: o board é redesenhado o tempo todo) */
let soltouAgora = false;
$('#board').addEventListener('click', ev => {
  const alvo = ev.target.closest('[data-acao]');
  const col = ev.target.closest('.kcol');
  const lista = col && col.dataset.lista;
  if (alvo) {
    const a = alvo.dataset.acao;
    if (a === 'novo-card') { compondo = { lista, topo: false }; renderBoard(); }
    else if (a === 'cancelar-card') { compondo = null; renderBoard(); }
    else if (a === 'salvar-card') salvarCardNovo(lista);
    else if (a === 'usar-modelo') popModelos(alvo, lista);
    else if (a === 'expandir') alternarRecolhida(lista);
    else if (a === 'renomear-lista') { renomeandoLista = lista; renderBoard(); }
    else if (a === 'menu-lista') menuLista(alvo, lista);
    return;
  }
  const card = ev.target.closest('.kcard');
  if (card && !soltouAgora) abrirCard(card.dataset.id);
});
/* Botão direito no card: as ações rápidas. Arquivar mora AQUI e dentro do card — não
   tem atalho de teclado (no Trello o "c" arquivava card sem querer). */
const ancoraNoPonto = (x, y) => ({ contains: () => false,
  getBoundingClientRect: () => ({ left: x, right: x, top: y, bottom: y, width: 0, height: 0 }) });
$('#board').addEventListener('contextmenu', ev => {
  const el = ev.target.closest('.kcard');
  if (!el) return;
  ev.preventDefault();
  const c = S.cards.find(x => x.id === el.dataset.id);
  if (!c) return;
  abrirPop(ancoraNoPonto(ev.clientX, ev.clientY), c.nome, () => `<div class="rows">
      <div class="opt" data-q="abrir">${svg('desc')}<span class="nm">Abrir card</span></div>
      <div class="opt" data-q="etiquetas">${svg('etiqueta')}<span class="nm">Etiquetas…</span></div>
      <div class="opt" data-q="membros">${svg('pessoa')}<span class="nm">Membros…</span></div>
      <div class="opt" data-q="prazo">${svg('relogio')}<span class="nm">Datas…</span></div>
      <div class="opt" data-q="link">${svg('link')}<span class="nm">Copiar link</span></div>
      <div class="opt" data-q="mover">${svg('mover')}<span class="nm">Mover…</span></div>
      <div class="opt" data-q="copiar">${svg('copiar')}<span class="nm">Copiar…</span></div>
      <div class="opt" data-q="seguir">${svg('olho')}<span class="nm">${eSigo(c) ? 'Deixar de seguir' : 'Seguir'}</span></div>
      <div class="opt" data-q="arquivar">${svg('arquivo')}<span class="nm">Arquivar</span></div>
    </div>`, corpo => corpo.addEventListener('click', async e => {
    const o = e.target.closest('[data-q]'); if (!o) return;
    fecharPop();
    const q = o.dataset.q;
    if (q === 'abrir') return abrirCard(c.id);
    if (q === 'link') return copiarLink(c.id);
    if (q === 'arquivar') return arquivarCard(c.id);
    if (q === 'seguir') return tentar(() => KB_FONTE.seguir(c.id, S.eu.membroId, !eSigo(c)));
    await abrirCard(c.id);                // etiquetas, membros, datas, mover, copiar: os do card
    const b = $(`.dlg-side [data-a="${q}"]`); if (b) b.click();
  }));
});

$('#board').addEventListener('keydown', ev => {
  if (ev.target.id === 'inCard') {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); salvarCardNovo(ev.target.closest('.kcol').dataset.lista); }
    if (ev.key === 'Escape') { compondo = null; renderBoard(); }
  } else if (ev.target.id === 'inLista') {
    if (ev.key === 'Enter') ev.target.blur();
    if (ev.key === 'Escape') { renomeandoLista = null; renderBoard(); }
  } else if (ev.target.id === 'inNovaLista' && ev.key === 'Enter') {
    const nome = ev.target.value.trim();
    if (!nome) return;
    const ult = listasAbertas().slice(-1)[0];
    const todas = S.listas.reduce((m, l) => Math.max(m, l.pos), 0);
    tentar(() => KB_FONTE.criarLista(nome, Math.max(todas, ult ? ult.pos : 0) + KB.PASSO));
  } else if (ev.target.classList.contains('kcard') && (ev.key === 'Enter' || ev.key === ' ')) {
    ev.preventDefault(); abrirCard(ev.target.dataset.id);
  }
});
$('#board').addEventListener('focusout', ev => {
  if (ev.target.id !== 'inLista' || !renomeandoLista) return;
  const id = renomeandoLista, nome = ev.target.value.trim();
  renomeandoLista = null;
  const l = IX.lista.get(id);
  if (!nome || !l || nome === l.nome) { renderBoard(); return; }
  l.nome = nome; renderBoard();
  tentar(() => KB_FONTE.atualizarLista(id, { nome }));
});

async function salvarCardNovo(listaId) {
  const ic = $('#inCard');
  const nome = ic ? ic.value.trim() : '';
  if (!nome) { if (ic) ic.focus(); return; }
  ic.value = '';
  const cs = cardsDaLista(listaId);
  // no topo: metade da posição do primeiro; no fim: depois do último
  const pos = compondo && compondo.topo
    ? (cs[0] ? (KB.posEntre(null, cs[0].pos) || cs[0].pos / 2) : KB.PASSO)
    : (cs.length ? cs[cs.length - 1].pos + KB.PASSO : KB.PASSO);
  await tentar(() => KB_FONTE.criarCard(listaId, nome, pos));
}

/* "Criar a partir de modelo": lista os cards modelo; a cópia leva checklists,
   etiquetas, membros e anexos, como o "Criar card a partir do modelo" do Trello. */
async function popModelos(anc, listaId) {
  let modelos = [];
  try { modelos = await KB_FONTE.modelos(); } catch (e) { return toast(e.message, true); }
  const titulo = ($('#inCard') && $('#inCard').value.trim()) || '';
  abrirPop(anc, 'Criar a partir de modelo', () => modelos.length
    ? `<div class="rows">${modelos.map(m => `<div class="opt" data-m="${esc(m.id)}"><span class="nm">${esc(m.nome)}</span></div>`).join('')}</div>`
    : '<div class="sub">Nenhum card modelo. Abra um card e use "Tornar modelo".</div>',
    el => el.addEventListener('click', async ev => {
      const o = ev.target.closest('[data-m]'); if (!o) return;
      fecharPop();
      const m = modelos.find(x => x.id === o.dataset.m);
      const cs = cardsDaLista(listaId);
      const pos = compondo && compondo.topo ? (cs[0] ? cs[0].pos / 2 : KB.PASSO)
        : (cs.length ? cs[cs.length - 1].pos + KB.PASSO : KB.PASSO);
      compondo = null;
      const novo = await tentar(() => KB_FONTE.copiarCard(m.id, titulo || m.nome, listaId, pos,
        { checklists: true, etiquetas: true, membros: true, anexos: true, comentarios: false }));
      if (novo) abrirCard(novo);                 // a cópia nasce card comum, não modelo
    }));
}

/* Renumera as listas abertas na ordem dada (quando não cabe posição entre duas). */
async function renumerarListas(ordem) {
  const pos = KB.renumerar(ordem.length);
  for (let i = 0; i < ordem.length; i++) await KB_FONTE.atualizarLista(ordem[i].id, { pos: pos[i] });
}

function menuLista(anc, listaId) {
  const ls = listasAbertas(), i = ls.findIndex(l => l.id === listaId), l = ls[i];
  const n = cardsDaLista(listaId).length;
  abrirPop(anc, l.nome, () => `<div class="rows">
      <div class="opt" data-a="topo"><span class="nm">Adicionar card no topo</span></div>
      <div class="opt" data-a="renomear"><span class="nm">Renomear</span></div>
      <div class="opt" data-a="copiar-lista"><span class="nm">Copiar lista…</span></div>
      ${n && ls.length > 1 ? '<div class="opt" data-a="mover-todos"><span class="nm">Mover todos os cards desta lista…</span></div>' : ''}
      ${n > 1 ? '<div class="opt" data-a="ordenar"><span class="nm">Ordenar por…</span></div>' : ''}
      ${i > 0 ? '<div class="opt" data-a="esq"><span class="nm">Mover para a esquerda</span></div>' : ''}
      ${i < ls.length - 1 ? '<div class="opt" data-a="dir"><span class="nm">Mover para a direita</span></div>' : ''}
      <div class="opt" data-a="recolher"><span class="nm">Recolher lista</span></div>
      ${n ? '<div class="opt" data-a="arquivar-cards"><span class="nm">Arquivar todos os cards desta lista</span></div>' : ''}
      <div class="opt" data-a="arquivar"><span class="nm">Arquivar esta lista</span></div>
    </div>`, el => el.addEventListener('click', ev => {
    const o = ev.target.closest('.opt'); if (!o) return;
    const a = o.dataset.a;
    if (a === 'mover-todos') return popMoverTodos(anc, l);
    if (a === 'ordenar') return popOrdenar(anc, l);
    fecharPop();
    if (a === 'topo') { compondo = { lista: listaId, topo: true }; renderBoard(); }
    else if (a === 'recolher') alternarRecolhida(listaId);
    else if (a === 'copiar-lista') {
      const nome = prompt('Nome da cópia da lista', l.nome);
      if (!nome || !nome.trim()) return;
      const prox = ls[i + 1];
      const pos = KB.posEntre(l.pos, prox ? prox.pos : null) || l.pos + 1;
      toast('Copiando a lista…');
      tentar(() => KB_FONTE.copiarLista(l, nome.trim(), pos, cardsDaLista(listaId)))
        .then(r => { if (r) toast(`Lista "${nome.trim()}" criada com ${n} card${n === 1 ? '' : 's'}.`); });
    }
    else if (a === 'renomear') { renomeandoLista = listaId; renderBoard(); }
    else if (a === 'esq' || a === 'dir') {
      // troca de lugar com a vizinha: duas gravações, e a ordem fica certa mesmo
      // quando as duas tinham a mesma posição
      const v = ls[a === 'esq' ? i - 1 : i + 1];
      const pl = l.pos, pv = v.pos;
      const [pa, pb] = pl === pv ? (a === 'esq' ? [pv - 1, pv] : [pv + 1, pv]) : [pv, pl];
      tentar(async () => {
        await KB_FONTE.atualizarLista(l.id, { pos: pa });
        await KB_FONTE.atualizarLista(v.id, { pos: pb });
      });
    } else if (a === 'arquivar-cards') {
      const n = cardsDaLista(listaId).length;
      if (!confirm(`Arquivar os ${n} card${n === 1 ? '' : 's'} da lista "${l.nome}"? Eles continuam em Arquivados.`)) return;
      tentar(() => KB_FONTE.arquivarLista(listaId)).then(() => toast(`${n} card${n === 1 ? '' : 's'} arquivado${n === 1 ? '' : 's'}.`));
    } else if (a === 'arquivar') {
      const n = cardsDaLista(listaId).length;
      if (!confirm(`Arquivar a lista "${l.nome}"${n ? ` com ${n} card${n === 1 ? '' : 's'}` : ''}? Ela continua em Arquivados e pode ser restaurada.`)) return;
      tentar(() => KB_FONTE.atualizarLista(listaId, { arquivada: true }));
    }
  }));
}

function popMoverTodos(anc, l) {
  const cards = cardsDaLista(l.id);
  abrirPop(anc, 'Mover todos os cards para', () => `<div class="rows">${listasAbertas().filter(x => x.id !== l.id)
    .map(x => `<div class="opt" data-l="${esc(x.id)}"><span class="nm">${esc(x.nome)}</span></div>`).join('')}</div>`,
    el => el.addEventListener('click', ev => {
      const o = ev.target.closest('[data-l]'); if (!o) return;
      fecharPop();
      const destino = cardsDaLista(o.dataset.l);
      const fim = destino.length ? destino[destino.length - 1].pos : 0;
      tentar(() => KB_FONTE.moverTodos(cards, o.dataset.l, fim))
        .then(() => toast(`${cards.length} card${cards.length === 1 ? '' : 's'} movido${cards.length === 1 ? '' : 's'}.`));
    }));
}

function popOrdenar(anc, l) {
  const op = [['novos', 'Mais novos primeiro'], ['antigos', 'Mais antigos primeiro'], ['nome', 'Nome (A–Z)'],
              ['prazo', 'Prazo (mais próximo primeiro)']];
  abrirPop(anc, 'Ordenar lista', () => `<div class="rows">${op.map(([v, t]) =>
    `<div class="opt" data-o="${v}"><span class="nm">${t}</span></div>`).join('')}</div>`,
    el => el.addEventListener('click', ev => {
      const o = ev.target.closest('[data-o]'); if (!o) return;
      fecharPop();
      tentar(() => KB_FONTE.renumerarLista(KB.ordenar(cardsDaLista(l.id), o.dataset.o)));
    }));
}

/* ---------- arrastar e soltar ----------
   Só o card arrastado é gravado: ganha a posição entre os vizinhos de onde caiu
   (KB.posEntre). Se não couber número entre eles, a lista toda é renumerada. */
let arrastado = null;
const ph = document.createElement('div');
ph.className = 'placeholder';

/* Lista arrastada pelo cabeçalho: uma coluna tracejada mostra onde ela vai cair; ao
   soltar grava só a posição dela (o ponto médio entre as vizinhas). */
let arrastadoLista = null;
const phLista = document.createElement('div');
phLista.className = 'ph-lista';

$('#board').addEventListener('dragstart', ev => {
  const cab = ev.target.closest && ev.target.closest('.kcol-head');
  if (cab && !ev.target.closest('.kcard')) {
    const col = cab.closest('.kcol');
    arrastadoLista = col.dataset.lista;
    phLista.style.height = Math.min(col.offsetHeight, 400) + 'px';
    ev.dataTransfer.effectAllowed = 'move';
    try { ev.dataTransfer.setData('text/plain', 'lista:' + arrastadoLista); } catch (e) {}
    requestAnimationFrame(() => col.classList.add('arrastando'));
    return;
  }
  const c = ev.target.closest && ev.target.closest('.kcard');
  if (!c) return;
  arrastado = c.dataset.id;
  ph.style.height = c.offsetHeight + 'px';
  ev.dataTransfer.effectAllowed = 'move';
  try { ev.dataTransfer.setData('text/plain', arrastado); } catch (e) {}
  requestAnimationFrame(() => c.classList.add('arrastando'));
});
$('#board').addEventListener('dragend', () => {
  $$('.kcard.arrastando, .kcol.arrastando').forEach(c => c.classList.remove('arrastando'));
  if (ph.parentNode) ph.parentNode.removeChild(ph);
  if (phLista.parentNode) phLista.parentNode.removeChild(phLista);
  arrastado = null; arrastadoLista = null;
  pararRolagem();
});
$('#board').addEventListener('dragover', ev => {
  if (!arrastadoLista) return;
  ev.preventDefault();
  const board = $('#board');
  const cols = $$('.kcol:not(.arrastando)', board);
  const depois = cols.find(el => { const r = el.getBoundingClientRect(); return ev.clientX < r.left + r.width / 2; });
  if (depois) board.insertBefore(phLista, depois);
  else board.insertBefore(phLista, $('.nova-lista', board));
});
$('#board').addEventListener('drop', ev => {
  if (!arrastadoLista || !phLista.parentNode) return;
  ev.preventDefault();
  const id = arrastadoLista;
  const fila = Array.from($('#board').children).filter(e => e === phLista
    || (e.classList.contains('kcol') && e.dataset.lista !== id));
  const i = fila.indexOf(phLista);
  const prev = fila[i - 1] && IX.lista.get(fila[i - 1].dataset.lista);
  const prox = fila[i + 1] && IX.lista.get(fila[i + 1].dataset.lista);
  const atual = listasAbertas(), k = atual.findIndex(l => l.id === id);
  if ((atual[k - 1] || null) === (prev || null) && (atual[k + 1] || null) === (prox || null)) return renderBoard();
  const pos = KB.posEntre(prev ? prev.pos : null, prox ? prox.pos : null);
  if (pos !== null) { IX.lista.get(id).pos = pos; renderBoard(); return tentar(() => KB_FONTE.atualizarLista(id, { pos })); }
  // sem espaço entre as vizinhas: renumera todas na ordem nova
  const ordem = atual.filter(l => l.id !== id);
  ordem.splice(prox ? ordem.indexOf(prox) : ordem.length, 0, IX.lista.get(id));
  tentar(() => renumerarListas(ordem));
});

/* Rolagem durante o arrasto. O navegador não rola sozinho uma área com barra própria
   (o board rola de lado, cada coluna rola para baixo), então levar um card do Backlog
   ao Done era impossível: a tela não acompanhava. Aqui, com o card na mão, encostar na
   borda esquerda/direita do board rola o board, e no alto/pé de uma coluna rola a
   coluna — mais rápido quanto mais perto da borda. */
const BORDA_X = 110, VEL_X = 22, BORDA_Y = 70, VEL_Y = 16;
let ponteiro = null, rafRolagem = 0;
function velocidade(dist, borda, max) {
  return dist >= borda ? 0 : Math.ceil(max * (1 - Math.max(0, dist) / borda));
}
function passoRolagem() {
  rafRolagem = 0;
  if (!(arrastado || arrastadoLista) || !ponteiro) return;
  const board = $('#board'), r = board.getBoundingClientRect(), { x, y } = ponteiro;
  const dx = velocidade(x - r.left, BORDA_X, VEL_X) ? -velocidade(x - r.left, BORDA_X, VEL_X)
           : velocidade(r.right - x, BORDA_X, VEL_X);
  if (dx) board.scrollLeft += dx;
  const alvo = document.elementFromPoint(x, y);
  const col = alvo && alvo.closest('.kcol') && $('.kcol-cards', alvo.closest('.kcol'));
  if (col) {
    const c = col.getBoundingClientRect();
    const dy = velocidade(y - c.top, BORDA_Y, VEL_Y) ? -velocidade(y - c.top, BORDA_Y, VEL_Y)
             : velocidade(c.bottom - y, BORDA_Y, VEL_Y);
    if (dy) col.scrollTop += dy;
  }
  rafRolagem = requestAnimationFrame(passoRolagem);
}
function pararRolagem() {
  ponteiro = null;
  if (rafRolagem) cancelAnimationFrame(rafRolagem);
  rafRolagem = 0;
}
// no documento inteiro, e não só nas colunas: a borda pode cair na barra de cima, no
// espaço entre colunas ou no "Adicionar outra lista"
document.addEventListener('dragover', ev => {
  if (!arrastado && !arrastadoLista) return;
  ponteiro = { x: ev.clientX, y: ev.clientY };
  if (!rafRolagem) rafRolagem = requestAnimationFrame(passoRolagem);
});
document.addEventListener('drop', pararRolagem);
$('#board').addEventListener('dragover', ev => {
  if (!arrastado) return;
  const area = ev.target.closest('.kcol-cards') || (ev.target.closest('.kcol') && $('.kcol-cards', ev.target.closest('.kcol')));
  if (!area) return;
  ev.preventDefault();
  const irmaos = $$('.kcard:not(.arrastando)', area);
  const depois = irmaos.find(el => { const r = el.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; });
  if (depois) area.insertBefore(ph, depois); else area.appendChild(ph);
});
$('#board').addEventListener('drop', ev => {
  if (!arrastado || !ph.parentNode) return;
  ev.preventDefault();
  const area = ph.parentNode;
  // vizinhos de onde caiu, sem contar o próprio card arrastado
  const fila = Array.from(area.children).filter(e => e === ph
    || (e.classList.contains('kcard') && e.dataset.id !== arrastado));
  const i = fila.indexOf(ph);
  const prev = fila[i - 1], prox = fila[i + 1];
  const id = arrastado;
  soltouAgora = true; setTimeout(() => { soltouAgora = false; }, 50);
  moverCard(id, area.dataset.lista, prev ? prev.dataset.id : null, prox ? prox.dataset.id : null);
});

async function moverCard(id, listaId, antesId, depoisId) {
  const card = S.cards.find(c => c.id === id);
  if (!card) return;
  const antes = antesId ? S.cards.find(c => c.id === antesId) : null;
  const depois = depoisId ? S.cards.find(c => c.id === depoisId) : null;
  if (card.lista_id === listaId) {
    // caiu entre os mesmos vizinhos de antes: nada muda
    const ordem = cardsDaLista(listaId), k = ordem.indexOf(card);
    if ((ordem[k - 1] || null) === antes && (ordem[k + 1] || null) === depois) { renderBoard(); return; }
  }
  let pos = KB.posEntre(antes ? antes.pos : null, depois ? depois.pos : null);
  const mudouLista = card.lista_id !== listaId;
  card.lista_id = listaId;
  if (pos === null) {
    // sem espaço entre os vizinhos: renumera a lista inteira na ordem nova
    const ordem = cardsDaLista(listaId).filter(c => c.id !== id);
    const k = depois ? ordem.indexOf(depois) : ordem.length;
    ordem.splice(k < 0 ? ordem.length : k, 0, card);
    card.pos = (antes ? antes.pos : 0) + 1e-9;          // provisório, só para a tela
    renderBoard();
    await tentar(async () => {
      if (mudouLista) await KB_FONTE.atualizarCard(id, { lista_id: listaId });
      await KB_FONTE.renumerarLista(ordem);
    });
    return;
  }
  card.pos = pos;
  renderBoard();
  await tentar(() => KB_FONTE.atualizarCard(id, mudouLista ? { lista_id: listaId, pos } : { pos }));
}

let popAtual = null;
function abrirPop(anc, titulo, html, ligar) {
  fecharPop();
  const el = $('#pop');
  const desenhar = () => {
    el.innerHTML = `<div class="pop" role="dialog" aria-label="${esc(titulo)}">
      <button class="ico-btn fechar-pop" type="button" aria-label="Fechar">${svg('x', 14)}</button>
      <h5>${esc(titulo)}</h5><div class="pop-corpo">${html()}</div></div>`;
    const p = $('.pop', el);
    const r = anc.getBoundingClientRect();
    const w = p.offsetWidth, h = p.offsetHeight;
    let x = Math.min(r.left, window.innerWidth - w - 8), y = r.bottom + 6;
    if (y + h > window.innerHeight - 8) y = Math.max(8, r.top - h - 6);
    p.style.left = Math.max(8, x) + 'px'; p.style.top = y + 'px';
    $('.fechar-pop', p).onclick = fecharPop;
    if (ligar) ligar($('.pop-corpo', p), desenhar);
  };
  popAtual = { anc };
  desenhar();
  const primeiro = $('#pop input:not([type=checkbox]), #pop textarea, #pop select');
  if (primeiro) primeiro.focus();
}

const EMOJIS = ['👍', '👏', '✅', '🙌', '🙏', '🤩', '🎉', '😊', '😂', '😉', '😍', '👀', '❤️', '🔥', '💪', '😮', '😢', '👎'];
function reacoes(x) {
  const grupos = new Map();
  (x.kanban_reacoes || []).forEach(r => {
    const g = grupos.get(r.emoji) || { n: 0, meu: false, nomes: [] };
    g.n++; g.nomes.push(r.autor_nome || '?');

    grupos.set(r.emoji, g);

    `<button class="reacao${g.meu ? ' minha' : ''}" data-a="reagir" data-emoji="${esc(e)}" type="button"
