<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estruturas Societárias · Luxor P&amp;C</title>
<!-- Aba "Estruturas Societárias". Tudo vem do bot das estruturas societárias
     (repo controle-estruturas-societarias), que confere o login de cada pedido no
     Supabase do hub: POST /hub/ask (chat), GET /hub/dados (quadro societário e
     participações), GET /hub/organogramas (+ /arquivo). Nada disso passa pelo bucket. -->
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../theme.css">
<style>
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.so-wrap{max-width:1500px;margin:0 auto;padding:18px 22px 28px}
.so-abas{margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm)}
.so-view[hidden]{display:none}
.so-erro{color:var(--neg);font-size:13px}
.so-muted{color:var(--ink-3);font-size:12px}
.so-badge{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;
  border-radius:6px;border:1px solid var(--line-strong);color:var(--ink-2);margin-left:6px;vertical-align:middle}
.so-btn{background:var(--orange);color:#201700;border:0;border-radius:var(--r-sm);height:var(--ctl-h);
  padding:0 16px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.so-btn[disabled]{opacity:.5;cursor:default}
.so-btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong);font-weight:500}
.so-busca{height:var(--ctl-h);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  color:var(--ink);padding:0 12px;font:inherit;font-size:13px;width:100%;box-sizing:border-box}
.so-link{color:var(--orange);cursor:pointer;text-decoration:none;background:none;border:0;padding:0;font:inherit;text-align:left}
.so-link:hover{text-decoration:underline}

/* ── chat ── */
.so-chat{display:flex;flex-direction:column;height:calc(100vh - 92px);min-height:420px}
.so-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:4px 2px 14px}
.so-msg{max-width:min(860px,92%);padding:12px 15px;border-radius:var(--r);font-size:14px;line-height:1.55;
  overflow-wrap:anywhere}
.so-msg.eu{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:4px}
.so-msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.so-msg.bot.erro{border-color:var(--neg)}
.so-msg .quem{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.so-msg code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:12.5px}
.so-msg img{display:block;max-width:100%;margin-top:12px;border-radius:var(--r-sm);background:#fff;cursor:zoom-in}
.so-msg .arquivos{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.so-msg details{margin-top:12px;font-size:12px;color:var(--ink-2)}
.so-msg details ul{margin:6px 0 0;padding-left:18px}
.so-vazio{margin:auto;text-align:center;color:var(--ink-3);font-size:13px}
.so-compor{display:flex;gap:10px;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px}
.so-compor textarea{flex:1;resize:none;min-height:44px;max-height:180px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;font:inherit;font-size:14px;line-height:1.45;box-sizing:border-box}
.so-compor textarea:focus,.so-busca:focus{outline:none;border-color:var(--orange)}
.so-pensando{color:var(--ink-2);font-size:13px}
.so-pensando::after{content:"";display:inline-block;width:10px;height:10px;margin-left:8px;border-radius:50%;
  border:2px solid var(--ink-3);border-top-color:var(--orange);animation:gira .8s linear infinite;vertical-align:-1px}
@keyframes gira{to{transform:rotate(360deg)}}

/* ── lista × ficha (organogramas, empresas, investidores) ── */
.so-topo{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.so-topo .seg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm)}
.so-duas{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:16px;align-items:start}
.so-lista{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;
  max-height:calc(100vh - 150px);overflow-y:auto;position:sticky;top:12px}
.so-lista .so-busca{margin-bottom:8px}
.so-item{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink-2);font:inherit;font-size:13px;
  padding:7px 10px;border-radius:7px;cursor:pointer}
.so-item:hover{background:var(--surface-2);color:var(--ink)}
.so-item.on{background:var(--orange-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--orange)}
.so-item .so-muted{display:block;font-size:11px}
.so-ficha h2{font-family:var(--font-serif);font-size:20px;margin:0 0 4px;font-weight:600}
.so-kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 18px;margin:14px 0 4px}
.so-kv .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.so-kv .v{font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.so-tab{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.so-tab th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500;
  text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong)}
.so-tab td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.so-tab .num{text-align:right;white-space:nowrap}
.so-docs{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);columns:2;column-gap:28px}
.so-docs li{break-inside:avoid;margin-bottom:4px}
.so-org img{display:block;max-width:100%;border-radius:var(--r-sm);background:#fff;cursor:zoom-in}
.so-org .so-muted{margin-bottom:10px}
/* ── procurações ── */
.so-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.so-kpis .kpi{cursor:pointer;border:1px solid var(--line)}
.so-kpis .kpi.on{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.so-st{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:6px;white-space:nowrap}
.so-st.vencida{background:rgba(229,103,78,.18);color:var(--neg)}
.so-st.vence_7{background:var(--orange-soft);color:var(--orange)}
.so-st.vence_30{background:rgba(242,193,78,.16);color:var(--warn)}
.so-st.vigente{background:var(--teal-soft);color:var(--teal-light)}
.kpi .val.vencida{color:var(--neg)} .kpi .val.vence_7{color:var(--orange)} .kpi .val.vence_30{color:var(--warn)}
.so-sel{height:var(--ctl-h);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  color:var(--ink);padding:0 10px;font:inherit;font-size:13px}
.so-tab td.poderes{min-width:220px;color:var(--ink-2)}
.so-texto{font-size:14px;line-height:1.55;color:var(--ink-2);margin:0}
.so-lista-proc{margin:0;padding-left:18px;font-size:14px;line-height:1.6}
#abas button[hidden]{display:none}
.so-kpis.cinco{grid-template-columns:repeat(5,minmax(0,1fr))}
.so-st.provavel{background:rgba(229,103,78,.18);color:var(--neg)}
.so-st.possivel{background:rgba(242,193,78,.16);color:var(--warn)}
.so-st.remoto{background:var(--teal-soft);color:var(--teal-light)}
.so-st.sem{background:var(--surface-2);color:var(--ink-3)}
.kpi .val.provavel{color:var(--neg)} .kpi .val.possivel{color:var(--warn)} .kpi .val.prazo{color:var(--orange)}
@media (max-width:860px){
  .so-kpis,.so-kpis.cinco{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .so-wrap{padding:12px}
  .so-duas{grid-template-columns:1fr}
  .so-lista{position:static;max-height:260px}
  .so-docs{columns:1}
  .so-chat{height:calc(100vh - 80px)}
}
</style>
</head>
<body>
<div class="so-wrap">
  <nav class="seg so-abas" id="abas" aria-label="Seções">
    <button data-v="chat">Chat</button>
    <button data-v="procuracoes">Procurações</button>
    <button data-v="organogramas">Organogramas</button>
    <button data-v="empresas">Empresas</button>
    <button data-v="investidores">Investidores</button>
    <button data-v="advogados">Advogados</button>
    <button data-v="processos" id="btnProcessos" hidden>Processos</button>
  </nav>

  <section class="so-view" id="v-chat">
    <div class="so-chat">
      <div class="so-msgs" id="msgs"></div>
      <form class="so-compor" id="compor">
        <textarea id="pergunta" rows="1" placeholder="Pergunte sobre as empresas do grupo…" maxlength="2000"></textarea>
        <button class="so-btn" id="enviar" type="submit">Enviar</button>
      </form>
    </div>
  </section>
  <section class="so-view" id="v-procuracoes" hidden></section>
  <section class="so-view" id="v-organogramas" hidden></section>
  <section class="so-view" id="v-empresas" hidden></section>
  <section class="so-view" id="v-investidores" hidden></section>
  <section class="so-view" id="v-advogados" hidden></section>
  <section class="so-view" id="v-processos" hidden></section>
</div>

<script src="../vendor/supabase.min.js"></script>
<script src="config.js"></script>
<script src="so_app.js"></script>
</body>
</html>
