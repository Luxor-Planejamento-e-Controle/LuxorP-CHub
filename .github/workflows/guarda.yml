name: guarda

# Barreira obrigatória do repo público. O hook local (.githooks/pre-commit) só
# existe em quem rodou tools/install_hooks.py — esta Action roda sempre, em
# todo PR, e não dá pra pular. É ela que de fato impede PII/segredo de entrar.
#
# Minutos de Action são gratuitos em repo público, e isto NÃO consome crédito
# do Netlify (só o deploy de produção consome).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  segredos:
    name: PII e segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # precisa do histórico p/ diffar contra a base

      - name: Arquivos alterados
        id: alterados
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            # push inicial de branch vem com base zerada: cai pro commit anterior
            git cat-file -e "$base^{commit}" 2>/dev/null || base="$head~1"
          fi
          arquivos=$(git diff --name-only --diff-filter=ACM "$base" "$head")
          echo "n=$(printf '%s' "$arquivos" | grep -c . || true)" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$arquivos" > /tmp/alterados.txt
          echo "Alterados:"; sed 's/^/  /' /tmp/alterados.txt

      - name: Scan dos arquivos alterados
        run: |
          arquivos=$(cat /tmp/alterados.txt)
          [ -z "$arquivos" ] && { echo "nada a checar"; exit 0; }
          sh tools/scan_segredos.sh $arquivos

      # Rede de segurança: mesmo que o diff esteja limpo, nenhum caminho
      # proibido pode existir na árvore (ex.: entrou num commit anterior).
      - name: Nenhum caminho proibido na árvore
        run: |
          proibidos=$(git ls-files \
            'assets/data/*' 'assets/inadimplencia/*' 'output_pbi/*' \
            '*.local.sql' '*.xlsx' '*.xlsm' '*.csv' '*.parquet' '*.pbix' \
            '.env' '.env.*' | grep -v '^\.env\.example$' || true)
          if [ -n "$proibidos" ]; then
            echo "Arquivos que nunca deveriam estar versionados:" >&2
            printf '  %s\n' $proibidos >&2
            exit 1
          fi
          echo "árvore limpa"

  sintaxe:
    name: Sintaxe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: JS do hub
        run: |
          for f in assets/app.js assets/auth.js assets/config.js; do
            [ -f "$f" ] && node --check "$f" && echo "ok $f"
          done
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Scripts Python
        run: |
          for f in tools/*.py; do
            python -m py_compile "$f" && echo "ok $f"
          done

  testes:
    name: Testes dos painéis
    runs-on: ubuntu-latest
    # Um navegador travado não pode segurar o runner por seis horas.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Playwright e Chromium
        # As suítes abrem o painel num navegador de verdade e interceptam a rede. Não
        # sobe servidor: cada teste faz goto() num file:// do próprio repo.
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Suítes dos painéis
        # A lista sai de `find`, não escrita à mão: arquivo de teste novo passa a rodar
        # sozinho. Lista à mão envelhece — foi assim que a barreira de blueprints do repo
        # das Functions ficou três pastas atrás do que ela devia conferir.
        run: |
          arquivos=$(find assets -name 'test_*.py' | sort)
          if [ -z "$arquivos" ]; then
            echo "::error::nenhum test_*.py em assets/ — o find não pode voltar vazio"
            exit 1
          fi
          falhou=""
          for f in $arquivos; do
            echo "::group::$f"
            python "$f" || falhou="$falhou%0A  - $f"
            echo "::endgroup::"
          done
          if [ -n "$falhou" ]; then
            echo "::error::suítes com falha:$falhou"
            exit 1
          fi
          echo "todas as suítes passaram"

  # Portão único, e é ESTE o nome que a proteção da main exige.
  #
  # O GitHub publica um status por JOB ("PII e segredos", "Sintaxe") — nunca um com o
  # nome do workflow. A proteção pedia o contexto `guarda`, que ninguém reportava: todo
  # PR ficava em "Waiting for status to be reported", sem erro e sem fim, e a barreira
  # que devia ser obrigatória nunca chegava a bloquear nada de fato.
  #
  # Com o portão, a proteção passa a apontar para algo real e continua valendo se um job
  # for renomeado. Job novo entra aqui no `needs` — uma linha — em vez de exigir que
  # alguém lembre de mexer na configuração do repositório.
  guarda:
    name: guarda
    needs: [segredos, sintaxe, testes]
    # `always()` para o portão rodar mesmo com um dependente falhando ou pulado: sem
    # isso ele seria PULADO junto, o status nunca sairia e o PR voltaria a esperar para
    # sempre — falha aberta, exatamente o que este job existe para impedir.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resultado dos jobs
        run: |
          echo "segredos: ${{ needs.segredos.result }}"
          echo "sintaxe:  ${{ needs.sintaxe.result }}"
          echo "testes:   ${{ needs.testes.result }}"
          [ "${{ needs.segredos.result }}" = "success" ] || exit 1
          [ "${{ needs.sintaxe.result }}"  = "success" ] || exit 1
          [ "${{ needs.testes.result }}"   = "success" ] || exit 1
          echo "guarda ok"
