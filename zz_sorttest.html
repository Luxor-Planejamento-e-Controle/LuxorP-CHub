<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>teste ordenação</title>
<style>
 body{margin:0;font:13px system-ui;background:#0A1B20;color:#eee}
 pre{margin:0;padding:10px;font-size:12px;background:#12303A;white-space:pre-wrap}
 iframe{width:100%;height:60vh;border:0;background:#0A1B20}
 .ok{color:#54C983} .bad{color:#F0705A} .info{color:#8AA6AB}
</style></head><body>
<pre id="log">carregando...</pre>
<iframe id="f"></iframe>
<script>
const log = m => document.getElementById('log').innerHTML += '\n' + m;
const ok  = (c,m) => log((c?'<span class=ok>OK   </span>':'<span class=bad>FALHA</span>')+' '+m);

// mesma leitura de valor que o script de ordenação usa
function valorDe(td){
  const s = ((td && td.textContent)||'').trim();
  if(!s || s === '-' || s === '–') return {n:null, s:''};
  const d = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(d) return {n:+(d[3]+d[2]+d[1]), s};
  const num = s.replace(/[R$\s%]/g,'').replace(/\./g,'').replace(',','.');
  return /^-?\d+(\.\d+)?$/.test(num) ? {n:parseFloat(num), s} : {n:null, s:s.toLowerCase()};
}
// a coluna está de fato ordenada no sentido pedido?
function ordenada(tb, i, dir){
  const v = [...tb.rows].filter(r=>!/row-total/.test(r.className)).map(r=>valorDe(r.cells[i]));
  for(let k=1;k<v.length;k++){
    const a=v[k-1], b=v[k];
    let c;
    if(a.n!==null && b.n!==null) c = a.n-b.n;
    else if(a.n!==null) c = -1;
    else if(b.n!==null) c = 1;
    else c = a.s.localeCompare(b.s,'pt-BR');
    if(dir==='asc' ? c>0 : c<0) return false;
  }
  return true;
}
(async () => {
  document.getElementById('log').textContent = 'carregando dashboard...';
  const html = await (await fetch('/assets/inadimplencia/dashboard.html')).text();
  const f = document.getElementById('f');
  f.onload = () => setTimeout(() => {
    const d = f.contentDocument;
    const tabs = [...d.querySelectorAll('table')].filter(t => t.tBodies[0] && t.tBodies[0].rows.length > 2);
    log(`tabelas com dados: ${tabs.length}\n`);
    let falhas = 0;
    tabs.forEach((t, ti) => {
      const ths = t.tHead.rows[0].cells, tb = t.tBodies[0];
      for (let ci = 0; ci < ths.length; ci++) {
        const th = ths[ci], nome = th.textContent.trim().slice(0,20);
        th.click();
        const d1 = th.getAttribute('data-dir');
        const r1 = ordenada(tb, ci, d1);
        th.click();
        const d2 = th.getAttribute('data-dir');
        const r2 = ordenada(tb, ci, d2);
        const bom = r1 && r2 && d1 !== d2;
        if (!bom) falhas++;
        ok(bom, `tab${ti+1} "${nome}" — 1o=${d1}${r1?'':' NAO ORDENOU'} · 2o=${d2}${r2?'':' NAO ORDENOU'}`);
        // alinhamento: th numérico deve ter class num
        const ehNum = valorDe((tb.rows[0]||{cells:[]}).cells[ci]).n !== null;
        if (ehNum && !th.classList.contains('num')) { falhas++; ok(false, `tab${ti+1} "${nome}" — th numérico sem alinhamento à direita`); }
      }
      const rt = [...tb.rows].findIndex(r => /row-total/.test(r.className));
      if (rt >= 0) { const bom = rt === tb.rows.length-1; if(!bom) falhas++; ok(bom, `tab${ti+1}: linha de total no fim`); }
    });
    log(`\n<span class="${falhas?'bad':'ok'}">${falhas} falha(s)</span>`);
  }, 700);
  f.srcdoc = html;
})();
</script>
</body></html>
